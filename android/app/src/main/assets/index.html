<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>if(window.AndroidMemoTalk)document.documentElement.classList.add('native-android');</script>
<style>:root{--memo-safe-top:env(safe-area-inset-top,0px);--memo-safe-right:env(safe-area-inset-right,0px);--memo-safe-bottom:env(safe-area-inset-bottom,0px);--memo-safe-left:env(safe-area-inset-left,0px);padding-top:var(--memo-safe-top);padding-bottom:var(--memo-safe-bottom)}html.native-android{--memo-safe-top:0px;--memo-safe-right:0px;--memo-safe-bottom:0px;--memo-safe-left:0px}img{max-width:100%}[hidden]{display:none!important}
/* Optional app-launcher-like layout for the same folders and rooms. */
.list.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));align-content:start;gap:12px;padding:14px 14px 24px;}
.list.grid-view .folderline{position:relative;min-height:110px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px!important;border:1px solid var(--line);border-radius:18px;background:var(--surface-2);gap:2px;}
.list.grid-view .folderline .foldtoggle{flex:initial;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;width:100%;min-width:0;}
.list.grid-view .folderline .foldtoggle svg{width:42px;height:42px;}
.list.grid-view .folderline .foldtoggle svg:first-child{display:none;}
.list.grid-view .folderline .foldname{max-width:100%;font-size:13px;white-space:normal;overflow-wrap:anywhere;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.list.grid-view .folderline .foldcount{font-size:11px;}
.list.grid-view .folderline .foldmenu{position:absolute;right:0;top:0;padding:1px 8px;}
.list.grid-view .room{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-width:0;padding:8px 3px!important;gap:6px;text-align:center;border-radius:15px;}
.list.grid-view .room .av{width:62px;height:62px;border-radius:19px;font-size:24px;}
.list.grid-view .room .rmain{width:100%;align-items:center;}
.list.grid-view .room .rtop{display:flex;justify-content:center;width:100%;}
.list.grid-view .room .rname{white-space:normal;max-width:100%;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;word-break:break-word;}
.list.grid-view .room .rtags,.list.grid-view .room .rlast,.list.grid-view .room .rtime{display:none;}
.list.grid-view .section-label{grid-column:1/-1;padding:6px 0 0;}
.list.grid-view .empty{grid-column:1/-1;}
</style>
<style>
@media (min-width:760px){.app.list-collapsed .pane-list{display:none}.app.list-collapsed .pane-room{flex:1 1 100%;min-width:0}.desktop-feature{display:grid}}
@media (max-width:759px){.desktop-feature{display:none!important}}
.memo-sentence-row{display:flex;align-items:flex-start;gap:10px;padding:10px 3px;border-bottom:1px solid var(--line)}
.memo-sentence-row label{flex:1;min-width:0;display:flex;align-items:flex-start;gap:9px;white-space:pre-wrap;overflow-wrap:anywhere}
.memo-sentence-row label input{flex:0 0 auto;margin-top:5px;accent-color:var(--accent)}
.memo-sentence-row button{flex:0 0 auto;border-radius:8px;padding:7px 9px;background:var(--surface-2);font-size:12px}
.memo-sentence-toolbar{display:flex;align-items:center;gap:9px;margin:12px 0;flex-wrap:wrap}
.memo-sentence-toolbar button{border-radius:9px;background:var(--surface-2);padding:9px 12px}
.memo-sentence-toolbar .primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
</style>
<title>메모톡 v17 — 자동 백업과 휴지통</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: two panes — room list and chat. Side by side on wide screens, one at a time on phones. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EEF0F3; --line:#E2E5EA;
  --ink:#181B21; --ink-2:#596070; --ink-3:#8A91A0;
  --chat:#B9CCDD; --meta-ink:#4A5868; --pill-bg:rgba(24,36,52,.16); --pill-ink:#FFFFFF;
  --bubble:#FFE45C; --bubble-ink:#1C1D21; --accent:#FFE45C; --accent-ink:#1C1D21;
  --danger:#D63A3F; --mark:#FFB23E; --mark-ink:#1C1D21;
  --overlay:rgba(12,16,22,.48); --shadow:0 12px 32px rgba(20,28,40,.18);
  --av1:#F6D7C3; --av2:#CFE3D4; --av3:#D3DDF2; --av4:#EAD3EC; --av5:#F3E6B5; --av6:#CDE7EA; --av-ink:#2A2F38;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111317; --surface:#191C21; --surface-2:#23272E; --line:#2A2F37;
  --ink:#ECEEF2; --ink-2:#A8AFBC; --ink-3:#757D8C;
  --chat:#1B2129; --meta-ink:#8C96A5; --pill-bg:rgba(255,255,255,.08); --pill-ink:#B8C0CC;
  --bubble:#F0D44C; --bubble-ink:#17181B; --accent:#F0D44C; --accent-ink:#17181B;
  --danger:#F06A6E; --mark:#C98A2E; --mark-ink:#111111;
  --overlay:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  --av1:#5A3F31; --av2:#2F4A37; --av3:#33405C; --av4:#4D3550; --av5:#55491F; --av6:#2B4A4E; --av-ink:#EEF0F3;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#191C21; --surface-2:#23272E; --line:#2A2F37;
  --ink:#ECEEF2; --ink-2:#A8AFBC; --ink-3:#757D8C;
  --chat:#1B2129; --meta-ink:#8C96A5; --pill-bg:rgba(255,255,255,.08); --pill-ink:#B8C0CC;
  --bubble:#F0D44C; --bubble-ink:#17181B; --accent:#F0D44C; --accent-ink:#17181B;
  --danger:#F06A6E; --mark:#C98A2E; --mark-ink:#111111;
  --overlay:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  --av1:#5A3F31; --av2:#2F4A37; --av3:#33405C; --av4:#4D3550; --av5:#55491F; --av6:#2B4A4E; --av-ink:#EEF0F3;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--memo-safe-top);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
.gut{padding-left:max(16px,var(--memo-safe-left));padding-right:max(16px,var(--memo-safe-right))}
svg{display:block}

/* v15: keep a single viewport owner. Android reduces the actual WebView via
   WindowInsets in MainActivity; the HTML must not subtract the IME again.
   On ordinary mobile browsers, JS may set --memo-visible-height to visualViewport. */
:root{--memo-visible-height:100%}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:relative;margin:0}
.app{height:var(--memo-visible-height);max-height:100%;display:flex;min-height:0;overflow:hidden}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;height:100%;overflow:hidden}
.pane-room{min-height:0;overflow:hidden}
/* The message list is the *only* vertical scroller while editing.
   Individual message rows must never shrink to fit a keyboard-shortened view. */
.msgs{min-height:0;flex:1 1 0;overflow-y:auto;overflow-x:hidden;
  touch-action:pan-y pinch-zoom;-webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;overflow-anchor:none}
.msgs>.row,.msgs>.day{flex:0 0 auto}
.composer{flex:0 0 auto;min-height:0;position:relative;z-index:1}

.pane-list{flex:0 0 340px;background:var(--surface);border-right:1px solid var(--line)}
.pane-room{flex:1;background:var(--chat)}
@media (max-width:759px){
  .pane-list{flex:1 0 100%;border-right:0}
  .pane-room{flex:1 0 100%}
  .app[data-view="list"] .pane-room{display:none}
  .app[data-view="room"] .pane-list{display:none}
}
@media (min-width:760px){ .back{display:none!important} }

/* headers */
.hdr{display:flex;align-items:center;gap:4px;min-height:56px;padding-block:6px;background:var(--surface);flex:0 0 auto}
.hdr h1{font-size:20px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:0 0 auto}
.ibtn:hover{background:var(--surface-2)}
.ibtn svg{width:22px;height:22px}
.room-hdr{background:var(--chat);color:var(--ink)}
.room-hdr .ibtn:hover{background:var(--pill-bg)}
.room-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.room-title b{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-title small{font-size:12px;color:var(--meta-ink);font-variant-numeric:tabular-nums}

/* search bars */
.sbar{display:flex;align-items:center;gap:6px;padding-block:6px 10px;background:var(--surface)}
.room-sbar{background:var(--chat)}
.sfield{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:0 12px;height:40px}
.room-sbar .sfield{background:var(--surface)}
.sfield svg{width:18px;height:18px;color:var(--ink-3);flex:0 0 auto}
.sfield input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;height:100%}
.scount{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* room list */
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:16px}
.room{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding-block:10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.room:hover{background:var(--surface-2)}
.room.on{background:var(--surface-2)}
.av{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-weight:600;font-size:18px;color:var(--av-ink);flex:0 0 auto}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column}
.rtop{display:flex;align-items:center;gap:5px;min-width:0}
.rname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtop svg{width:13px;height:13px;color:var(--ink-3);flex:0 0 auto}
.rtop .rname{flex:0 1 auto;max-width:72%}
.rtags{flex:0 1 auto;min-width:0;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagbar{display:flex;gap:6px;overflow-x:auto;padding-block:2px 10px;background:var(--surface);scrollbar-width:none;flex:0 0 auto}
.tagbar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:13.5px;white-space:nowrap}
.chip small{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);color:var(--surface)}
.chip.on small{color:inherit;opacity:.7}
.chip svg{width:12px;height:12px}
.flabel{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 2px 6px}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:6px 8px;margin-bottom:10px}
.tagedit:focus-within{border-color:var(--ink-3)}
.tagedit input{flex:1;min-width:9em;border:0;background:none;outline:none;font-size:16px;padding:4px}
.tagedit .chip{height:28px;background:var(--surface);color:var(--ink);padding:0 8px 0 10px}
.tagsugg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tagsugg:empty{display:none}
.tagsugg .chip{height:28px;font-size:13px}
.rlast{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtime{font-size:12px;color:var(--ink-3);align-self:flex-start;margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.section-label{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);padding-block:14px 6px}
.hit{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding-block:10px;border-bottom:1px solid var(--line)}
.hit:hover{background:var(--surface-2)}
.hit .hroom{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2)}
.hit .hroom b{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit .htext{font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all;overflow-wrap:anywhere}
.empty{padding:48px 24px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:14px}
.empty p{margin:0;max-width:30ch;text-wrap:balance}
.pbtn{background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:12px;padding:10px 18px}
.skel{height:66px;display:flex;align-items:center;gap:12px}
.skel i{display:block;background:var(--surface-2);border-radius:8px}
.storage-note{font-size:12px;color:var(--ink-3);padding-block:8px 4px}

.folderline{display:flex;align-items:center;gap:6px;width:100%;padding:9px 16px;background:var(--surface-2);border-top:1px solid var(--line);text-align:left;font-weight:600}
.folderline .foldtoggle{flex:1;display:flex;align-items:center;gap:8px;min-width:0;text-align:left}
.folderline .foldname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folderline .foldcount{font-size:12px;font-weight:400;color:var(--ink-3)}
.folderline .foldmenu{padding:4px 10px;font-size:19px}
.folderline .foldtoggle svg{width:16px;height:16px;flex:0 0 auto}
.folder-empty{padding:8px 20px;color:var(--ink-3);font-size:13px}
/* messages */
.msgs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:12px 16px;display:flex;flex-direction:column;gap:4px}
.day{align-self:center;background:var(--pill-bg);color:var(--pill-ink);font-size:12px;padding:4px 12px;border-radius:999px;margin:14px 0 8px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:flex-end;align-items:flex-end;gap:6px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row.gap{margin-top:6px}
.meta{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--meta-ink);line-height:1.3;white-space:nowrap;font-variant-numeric:tabular-nums;padding-bottom:1px}
.content{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:min(74%,520px);min-width:0}
.bubble{position:relative;background:var(--bubble);color:var(--bubble-ink);padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:15px;line-height:1.5;max-width:100%}
.row.first .bubble.lead{border-top-right-radius:4px}
.bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.bubble mark,.htext mark,.rmain mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.row.cur .bubble{box-shadow:0 0 0 2px var(--ink)}
.row.flash .bubble,.row.flash .pics{animation:flash var(--flash-duration) ease}
@keyframes flash{0%,40%{filter:brightness(.82)}100%{filter:none}}
.pics{display:grid;gap:4px;max-width:100%}
.pics.n1{grid-template-columns:minmax(0,240px)}
.pics.n2,.pics.n3,.pics.n4{grid-template-columns:repeat(2,minmax(0,120px))}
.pics img{width:100%;height:auto;max-height:320px;object-fit:cover;border-radius:12px;background:var(--pill-bg);cursor:zoom-in;display:block}
.pics:not(.n1) img{aspect-ratio:1;height:100%}
.room-empty{margin:auto;text-align:center;color:var(--meta-ink);padding:24px;max-width:28ch;text-wrap:balance}
.pick-room{margin:auto;color:var(--meta-ink)}

/* Individual memo grid mode */
.msgs.memo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;align-items:stretch;gap:10px;padding-top:14px;padding-bottom:24px}
.memo-grid .day{grid-column:1/-1;justify-self:center;margin:8px 0 0}
.memo-grid .row{position:relative;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px;min-width:0;margin:0;padding:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;min-height:106px;cursor:pointer;text-align:left}
.memo-grid .row:focus-visible{outline:2px solid var(--ink-2)}
.memo-grid .row .content{width:100%;max-width:100%;align-items:stretch;gap:8px;order:0}
.memo-grid .row .bubble{background:transparent;color:var(--ink);padding:0;border-radius:0;font-size:13px;line-height:1.5;white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:7;overflow:hidden;max-height:10.5em}
.memo-grid .row .meta{order:1;align-items:flex-start;margin-top:auto;padding-top:6px;color:var(--ink-3);font-size:11px}
.memo-grid .row .pics{width:100%;max-width:100%;grid-template-columns:repeat(2,minmax(0,1fr))}
.memo-grid .row .pics.n1{grid-template-columns:1fr}
.memo-grid .row .pics img{width:100%;height:90px;object-fit:cover;aspect-ratio:auto}
.memo-grid .row.cur{outline:2px solid var(--ink)}
.memo-grid .row.flash{animation:flash var(--flash-duration) ease}
@media(min-width:600px){.msgs.memo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.msgs.memo-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* Threaded comments attached to individual memo messages. */
.memo-comments{width:100%;max-width:100%;margin-top:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--ink);overflow:hidden}
.memo-comments summary{display:flex;align-items:center;gap:6px;min-height:40px;padding:8px 10px;cursor:pointer;font-size:12px;font-weight:600;list-style:none;touch-action:manipulation}
.memo-comments summary::-webkit-details-marker{display:none}
.memo-comments summary:before{content:'▸';color:var(--ink-2)}
.memo-comments[open] summary:before{content:'▾'}
.memo-comments-body{padding:0 10px 10px;display:flex;flex-direction:column;gap:7px}
.memo-comment{padding:8px 8px 8px 10px;border-radius:9px;background:var(--surface-2);font-size:13px;display:flex;align-items:flex-start;gap:6px;min-width:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.memo-comment-main{flex:1;min-width:0}
.memo-comment-text{white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.memo-comment-actions{width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto;border-radius:10px;font-size:21px;line-height:1;color:var(--ink-2);touch-action:manipulation}
.memo-comment-actions:hover,.memo-comment-actions:focus-visible{background:var(--surface);color:var(--ink)}
.memo-comment-time{display:block;font-size:10px;color:var(--ink-3);margin-top:4px}
.memo-comment-add{align-self:flex-end;min-height:38px;padding:7px 12px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600}
.memo-grid .memo-comments{margin-top:0}
.memo-comment-field{width:100%;min-height:112px;max-height:40vh;resize:vertical;white-space:pre-wrap}

/* composer */
.composer{background:var(--surface);padding-block:8px;padding-bottom:max(8px,var(--memo-safe-bottom));flex:0 0 auto;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.editbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.editbar b{color:var(--ink);font-weight:600}
.editbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editbar button{font-size:13px;color:var(--ink-2);padding:4px 8px;border-radius:8px}
.editbar button:hover{background:var(--surface-2)}
.pending{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.pthumb{position:relative;flex:0 0 auto}
.pthumb img{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block}
.pthumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center}
.pthumb button svg{width:12px;height:12px}
.crow{display:flex;align-items:flex-end;gap:6px}
.crow .ibtn{width:40px;height:40px}
.input{flex:1;min-width:0;resize:none;border:0;outline:none;background:var(--surface-2);border-radius:20px;padding:8px 14px;font-size:16px;line-height:1.45;max-height:132px;min-height:40px}
.send{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3);flex:0 0 auto;transition:background var(--fade-duration)}
.send.on{background:var(--accent);color:var(--accent-ink)}
.send svg{width:20px;height:20px}
.send.busy svg{animation:spin var(--spin-duration) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dropping .msgs{outline:3px dashed var(--meta-ink);outline-offset:-10px}

/* sheet / dialogs */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade var(--fade-duration) ease}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:20px 20px 0 0;padding-block:10px;padding-bottom:calc(12px + var(--memo-safe-bottom));padding-left:max(12px,var(--memo-safe-left));padding-right:max(12px,var(--memo-safe-right));box-shadow:var(--shadow);animation:up var(--sheet-duration) ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:20px;padding-bottom:12px}}
.sheet h2{font-size:15px;font-weight:600;margin:6px 8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet p{margin:0 8px 14px;color:var(--ink-2);font-size:14px}
.sheet .item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 10px;border-radius:12px;font-size:15.5px}
.sheet .item:hover{background:var(--surface-2)}
.sheet .item svg{width:20px;height:20px;color:var(--ink-2)}
.sheet .item.danger,.sheet .item.danger svg{color:var(--danger)}
.sheet .note{font-size:12.5px;color:var(--ink-3);padding:8px 10px 2px;margin:0}
.sheet .field{display:block;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;font-size:16px;outline:none;margin-bottom:14px}
.sheet .field:focus{border-color:var(--ink-3)}
.btns{display:flex;gap:8px;justify-content:flex-end;padding:0 4px 2px}
.btns button{padding:10px 18px;border-radius:12px;font-weight:600}
.btns .ghost{color:var(--ink-2)}
.btns .ghost:hover{background:var(--surface-2)}
.btns .ok{background:var(--accent);color:var(--accent-ink)}
.btns .ok.danger{background:var(--danger);color:#fff}

/* viewer */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:grid;place-items:center;animation:fade var(--fade-duration)}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(10px + var(--memo-safe-top));right:max(12px,var(--memo-safe-right));width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.viewer button svg{width:22px;height:22px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--memo-safe-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);font-size:14px;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);width:max-content;text-align:center;box-shadow:var(--shadow);animation:fade var(--fade-duration)}


/* Local Markdown folder mirroring (desktop-capable browsers). */
.file-sync-bar{display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--surface);border-top:1px solid var(--line);flex-shrink:0;min-width:0}
.file-sync-bar .file-sync-state{flex:1;min-width:0;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-sync-bar button{background:var(--surface-2);padding:8px 11px;min-height:38px;border-radius:10px;font-size:13px;font-weight:600;flex-shrink:0}
.file-sync-bar button:disabled{opacity:.5;cursor:progress}
.file-sync-bar[data-sync="error"] .file-sync-state{color:var(--danger)}
.file-sync-bar[data-sync="saved"] .file-sync-state{color:var(--ink)}
.file-sync-bar[data-sync="pending"] .file-sync-state{color:var(--ink-2)}
.vault-line{display:flex;align-items:center;gap:6px;min-height:64px;border-top:1px solid var(--line);padding:10px 2px;flex-wrap:wrap}
.vault-line-info{flex:1 1 120px;min-width:0;display:flex;flex-direction:column;gap:3px}
.vault-line-info b{font-size:14px;overflow-wrap:anywhere}
.vault-line-info small{font-size:12px;color:var(--ink-2)}
.vault-line button{padding:8px 10px;min-height:40px;border-radius:9px;background:var(--surface-2);font-size:12px}
.vault-line button.vault-danger{color:var(--danger)}
/* Room multi-selection and finger-driven folder drop */
.room-select-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex:0 0 auto}
.room-select-bar[hidden]{display:none!important}
.room-select-bar strong{flex:1;font-size:14px}
.room-select-bar button{padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:13px;white-space:nowrap}
.room-select-bar button.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.room-select-bar #room-select-delete{color:var(--danger);border:1px solid var(--danger)}
.room-select-bar button:disabled{opacity:.45;cursor:not-allowed}
.room-select-bar button:focus-visible{outline:2px solid var(--ink)}
.list.select-mode .room{position:relative;padding-right:42px!important}
.list.select-mode .room.selected{background:color-mix(in srgb,var(--accent) 22%,var(--surface));}
.list.select-mode .room.selected .av{box-shadow:0 0 0 2px var(--accent)}
.list .room,.list .folderline{touch-action:pan-y pinch-zoom}
/* Dedicated touch-safe grips let Android WebView drag items without scrolling the list. */
.drag-handle{flex:0 0 30px;min-width:30px;min-height:36px;display:grid;place-items:center;cursor:grab;color:var(--ink-2);font-size:21px;font-weight:700;line-height:1;user-select:none;-webkit-user-select:none;touch-action:none!important;-webkit-touch-callout:none}
.drag-handle:active{cursor:grabbing;color:var(--ink)}
.drag-handle *{touch-action:none!important}
.list.grid-view .room .drag-handle{min-height:25px;font-size:19px}
.list.grid-view .folderline .drag-handle{min-height:24px}
.room-checkbox{display:none;position:absolute;right:14px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:2px solid var(--ink-3);border-radius:50%;background:var(--surface);color:var(--accent-ink);align-items:center;justify-content:center;font-size:16px;line-height:1;font-weight:700}
.list.select-mode .room-checkbox{display:flex}
.list.select-mode .room.selected .room-checkbox{background:var(--accent);border-color:var(--accent)}
.list.grid-view.select-mode .room{padding-right:8px!important}
.list.grid-view.select-mode .room-checkbox{top:9px;right:7px;transform:none;z-index:2}
.list.grid-view.select-mode .room.selected{border:2px solid var(--accent);padding:6px!important}
.list .folderline.drop-hover{outline:3px solid var(--accent);outline-offset:-3px;background:color-mix(in srgb,var(--accent) 28%,var(--surface-2))}
.drop-root.drop-hover{outline:2px solid var(--ink);background:var(--accent)}
.drag-ghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:15px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow);max-width:225px;white-space:nowrap;font-weight:600;font-size:14px;transform:translate(-50%,-120%)}
.drag-ghost .drag-count{display:grid;place-items:center;min-width:25px;height:25px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.list.select-mode .folderline .foldtoggle:focus-visible{outline:2px solid var(--ink)}

.move-tools{display:flex;gap:6px;padding:6px 14px;flex-shrink:0;border-top:1px solid var(--line)}
.move-tools button,.move-result button{padding:7px 10px;border-radius:10px;background:var(--surface-2);font-size:13px;white-space:nowrap}
.move-tools #move-root{margin-left:auto;border:1px dashed var(--ink-3)}
.move-help{font-size:11px;color:var(--ink-2);margin:0;padding:0 14px 7px;flex-shrink:0}
.move-result{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface-2);font-size:12px;flex-shrink:0}
.move-result span{flex:1}.move-result button{background:var(--accent);color:var(--accent-ink);font-weight:600}
.folderline{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.folder-check{display:none;width:24px;height:24px;flex-shrink:0;border:2px solid var(--ink-3);border-radius:50%;background:var(--surface);font-size:16px;line-height:20px}
.select-mode .folder-check{display:block}.folderline.selected .folder-check{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.select-mode .folderline.selected{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.grid-view .folder-check{position:absolute;left:7px;top:7px;z-index:2}
.item-dragging{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.drag-source{opacity:.55}
/* Drop indicators for desktop room reordering: above / below another room. */
.list .room.drop-before{box-shadow:inset 0 4px 0 var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.list .room.drop-after{box-shadow:inset 0 -4px 0 var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.drop-hover{outline:3px solid var(--accent)!important;outline-offset:-3px;background:color-mix(in srgb,var(--accent) 35%,var(--surface))!important}
.drop-invalid{outline:2px dashed var(--danger)!important;outline-offset:-2px}
.drag-ghost{transform:none;max-width:min(280px,90vw);padding:10px 12px;white-space:normal}
.drag-ghost b{display:block;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drag-status{display:block;font-weight:400;font-size:11px;overflow-wrap:anywhere;max-width:220px}
.move-busy{pointer-events:none;opacity:.75}.move-busy .list{cursor:progress}
.destination-path{display:block;font-size:11px;font-weight:400;color:var(--ink-2)}
.sheet{max-height:calc(100dvh - var(--memo-safe-top) - 24px);overflow-y:auto;overscroll-behavior:contain}
.sheet .item:disabled{opacity:.45;cursor:not-allowed}
.tuning-row{padding:8px 4px;border-bottom:1px solid var(--line)}
.tuning-row label{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.tuning-row output{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2)}
.tuning-row>div{display:flex;gap:10px;align-items:center}.tuning-row input{width:100%;accent-color:var(--ink)}
.tuning-row button{width:36px;height:36px;font-size:22px;flex-shrink:0;background:var(--surface-2);border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.create-tools{display:flex;gap:8px;padding-block:0 10px;flex-shrink:0}
.create-tools button{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:14px;font-weight:600}
.create-tools svg{width:20px;height:20px}.create-tools #btn-new{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.room-entry{display:flex;align-items:stretch;min-width:0}.room-entry .room{flex:1;min-width:0;padding-right:8px}
.room-label-edit,.label-shortcut{flex-shrink:0;min-width:44px;min-height:44px;border-radius:10px;padding:6px;color:var(--ink-2);font-size:12px;font-weight:600}
.room-label-edit{align-self:center;margin-right:6px;background:var(--surface-2)}
.room-label-edit:hover,.label-shortcut:hover{background:var(--accent);color:var(--accent-ink)}
.room-label-edit small{display:block;font-size:11px;font-weight:400}
.list.grid-view .room-entry{flex-direction:column;align-items:stretch;gap:3px}
.list.grid-view .room-label-edit{align-self:stretch;margin:0;min-height:44px}
.list.grid-view .room-label-edit small{display:inline;margin-left:4px}
.label-input-row{display:flex;align-items:center;gap:8px;width:100%;min-width:0}
.label-input-row input{min-width:0;width:100%;min-height:44px}.label-input-row button{min-width:54px;min-height:44px;background:var(--accent);color:var(--accent-ink);border-radius:10px;font-weight:600}
.label-editor .chip{min-height:44px;height:auto;max-width:100%;white-space:normal;overflow-wrap:anywhere}
.label-editor .chip svg{width:16px;height:16px;flex-shrink:0}
.label-editor .tagedit{align-items:flex-start}.label-editor .btns button{min-height:44px}
.label-editor .label-help,.label-editor .label-status{font-size:12px;margin:4px 2px 10px;color:var(--ink-2)}
.label-editor .label-error{color:var(--danger);font-size:13px;margin:8px 2px}
.label-editor [aria-busy="true"]{cursor:progress}
.conflict-link{align-self:flex-end;min-height:40px;padding:7px 11px;border-radius:10px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;border:1px solid var(--line)}
.conflict-link:hover{background:var(--surface-2)}
.conflict-compare{max-height:min(65vh,620px);overflow:auto;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}
.conflict-compare h3{font-size:14px;margin:15px 0 5px}.conflict-compare p{margin:5px 0 12px}
.conflict-compare .old{background:#FFD9D9;color:#6A151A;border-radius:5px;padding:3px 5px}
.conflict-compare .new{background:#D8E9FF;color:#173F72;border-radius:5px;padding:3px 5px}
.conflict-compare .unchanged{color:var(--ink-2)}
.conflict-compare .full-copy{border-top:1px solid var(--line);margin-top:16px;padding-top:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="app" id="app" data-view="list">
  <section class="pane pane-list" aria-label="채팅방 목록">
    <header class="hdr gut">
      <h1>메모톡</h1>
      <button class="ibtn" id="btn-layout" aria-label="격자형 보기로 전환" title="목록/격자 보기"></button>
      <button class="ibtn" id="btn-gsearch" aria-label="전체 검색"></button>
      <button class="ibtn" id="btn-trash-shortcut" aria-label="휴지통 열기" title="휴지통 · 삭제 항목 복원"></button>
      <button class="ibtn" id="btn-more" aria-label="더보기"></button>
    </header>
    <div class="create-tools gut" role="group" aria-label="새 항목 만들기">
      <button id="btn-new-folder" type="button"><span data-icon="folder"></span>새 폴더</button>
      <button id="btn-new" type="button"><span data-icon="plusChat"></span>새 메모방</button>
    </div>
    <div class="sbar gut" id="gsearch" hidden>
      <label class="sfield"><span data-icon="search"></span><input id="gsearch-input" type="search" placeholder="검색 · #라벨로 범위 좁히기" autocomplete="off"></label>
      <button class="ibtn" id="gsearch-close" aria-label="검색 닫기"></button>
    </div>
    <div class="tagbar gut" id="tagbar" role="toolbar" aria-label="라벨로 거르기" hidden></div>
    <div class="room-select-bar" id="room-select-bar" role="toolbar" aria-label="메모방·폴더 선택 도구" hidden>
      <strong id="room-selected-count" aria-live="polite">0개 선택</strong>
      <button id="room-select-all" type="button">전체 선택</button>
      <button class="primary" id="room-select-move" type="button" disabled>이동</button>
      <button id="room-select-delete" type="button" disabled aria-label="선택한 메모방 삭제">삭제</button>
      <button id="room-select-cancel" type="button">취소</button>
    </div>
    <div class="move-tools"><button id="btn-select-items">선택</button><button id="btn-drag-settings">조작 설정</button><button id="move-root" data-drop-root="true">↰ 최상위</button></div>
    <p class="move-help" id="move-help">마우스로 끌기 · 휴대폰에서는 ⠿ 아이콘을 잡아 끌기</p>
    <div class="move-result" id="move-result" hidden><span id="move-result-text" role="status"></span><button id="move-undo">되돌리기</button></div>
    <div class="file-sync-bar" id="file-sync-bar" data-sync="off" role="group" aria-label="실제 Markdown 파일 저장">
      <span class="file-sync-state" id="file-sync-state" role="status" aria-live="polite">파일 폴더 연결 안 됨</span>
      <button id="btn-file-folder" type="button">파일 저장</button>
    </div>
    <div class="list" id="list" aria-describedby="move-help"></div>
    <div id="move-live" class="sr-only" role="status" aria-live="polite"></div>
  </section>

  <section class="pane pane-room" id="room-pane" aria-label="채팅방">
    <div class="pick-room" id="pick-room">채팅방을 골라 주세요</div>
    <div id="room" hidden style="display:contents">
      <header class="hdr room-hdr gut">
        <button class="ibtn back" id="btn-back" aria-label="목록으로"></button>
        <button class="ibtn desktop-feature" id="btn-toggle-list" aria-label="목록창 숨기기" title="목록창 숨기기" aria-pressed="false" type="button">☰</button>
        <div class="room-title"><b id="room-name"></b><small id="room-sub"></small></div>
        <button class="label-shortcut" id="btn-room-labels" type="button" aria-label="현재 메모방 라벨 편집" aria-haspopup="dialog">라벨</button>
        <button class="ibtn" id="btn-msg-layout" aria-label="메모 격자 보기" title="메모 보기 전환"></button>
        <button class="ibtn" id="btn-rsearch" aria-label="대화 검색"></button>
        <button class="ibtn desktop-feature" id="btn-popout" aria-label="현재 메모방 새 창으로 열기" title="새 창으로 열기" type="button">▣</button>
        <button class="ibtn" id="btn-rmenu" aria-label="채팅방 메뉴"></button>
      </header>
      <div class="sbar room-sbar gut" id="rsearch" hidden>
        <label class="sfield"><span data-icon="search"></span><input id="rsearch-input" type="search" placeholder="대화 내용 검색" autocomplete="off"><span class="scount" id="rsearch-count"></span></label>
        <button class="ibtn" id="rs-up" aria-label="이전 결과"></button>
        <button class="ibtn" id="rs-down" aria-label="다음 결과"></button>
        <button class="ibtn" id="rs-close" aria-label="검색 닫기"></button>
      </div>
      <div class="msgs gut" id="msgs" role="log"></div>
      <div class="composer gut">
        <div class="editbar" id="editbar" hidden><b>메시지 수정</b><span id="edit-preview"></span><button id="edit-cancel">취소</button></div>
        <div class="pending" id="pending" hidden></div>
        <div class="crow">
          <button class="ibtn" id="btn-attach" aria-label="사진 첨부"></button>
          <textarea class="input" id="input" rows="1" placeholder="메모 입력"></textarea>
          <button class="send" id="btn-send" aria-label="보내기"></button>
        </div>
      </div>
    </div>
  </section>
</div>
<input type="file" id="file-img" accept="image/*" multiple hidden>
<input type="file" id="file-backup" accept=".json,application/json" hidden>
<input type="file" id="file-transfer" accept=".zip,application/zip" hidden>

<script src="platform-bridge.js"></script>
<script src="mirror-engine.js"></script>
<script src="peer-sync-engine.js"></script>
<script src="peer-sync-client.js"></script>
<script>
(() => {
'use strict';
// 1400 ms = existing app default (not a library default). Higher = longer autosave delay.
const FILE_MIRROR_DELAY=1400;
// setTimeout accepts 0..2147483647 ms. Higher = longer delay; zero schedules next task.
const FILE_MIRROR_DELAY_MAX=2147483647;
// 0 ms = browser minimum delay; smaller values save sooner.
const FILE_MIRROR_DELAY_MIN=0;
// 1 ms = number-input default step; larger values make each adjustment coarser.
const FILE_MIRROR_DELAY_STEP=1;
// Custom default 420 ms (no library default); lower starts touch holding sooner.
const HOLD_DELAY = 420;
// Custom default 7 px; lower starts mouse dragging with less movement.
const DRAG_DISTANCE = 7;
// Custom default 10 px; higher tolerates more finger motion before a hold is cancelled.
const TOUCH_SLOP = 10;
// Custom default 64 px; higher widens the automatic scrolling edge zone.
const SCROLL_EDGE = 64;
// Custom default 550 px/s; higher scrolls the list faster while dragging.
const SCROLL_SPEED = 550;
// Custom default 700 ms; lower opens a folded destination folder sooner.
const FOLDER_HOVER_DELAY = 700;
// Custom default 22 px; higher places the preview farther above the pointer.
const PREVIEW_GAP = 22;
// Custom default 450 ms; higher suppresses delayed clicks for longer after a gesture.
const CLICK_GUARD_DELAY = 450;
// Original app default 2600 ms; higher leaves ordinary notifications visible longer.
const TOAST_DELAY = 2600;
// Original app default 30 ms; higher delays focusing newly opened input fields.
const FOCUS_DELAY = 30;
// Original app defaults 180/150 ms; higher delays search updates while typing.

function hl(s, q){
  if (!q) return esc(s);
  const lo = s.toLowerCase(), ql = q.toLowerCase();
  let out = '', i = 0, j;

}

function dataUrlToBlob(u){
  const [head, b64] = u.split(',');
  const mime = (head.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});

async function drawScaled(src, maxDim){
  const img = await loadImg(src);
  let w = img.naturalWidth, h = img.naturalHeight;
  const s = Math.min(1, maxDim / Math.max(w, h)); w = Math.max(1, Math.round(w*s)); h = Math.max(1, Math.round(h*s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,w,h); x.drawImage(img, 0, 0, w, h);
  return c;
}

let sheetOpen = null;
function openScrim(inner, onClose){
  closeSheet();
  const opener = document.activeElement;
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" tabindex="-1">${inner}</div>`;
  const dialog = scrim.firstElementChild;
  const heading = dialog.querySelector('h2');
  if (heading) { heading.id = 'sheet-title'; dialog.setAttribute('aria-labelledby', heading.id); }
  else dialog.setAttribute('aria-label', '메모톡 메뉴');
  scrim.addEventListener('keydown', event => {
    if (event.key !== 'Tab') return;
    const controls = [...dialog.querySelectorAll('button:not(:disabled), input:not(:disabled), textarea:not(:disabled), select:not(:disabled), a[href], [tabindex="0"]')].filter(control => control.getClientRects().length);
    const first = controls[0], last = controls[controls.length - 1];
    if (!first) { event.preventDefault(); dialog.focus(); }
    else if (event.shiftKey && (document.activeElement === first || document.activeElement === dialog)) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && (document.activeElement === last || document.activeElement === dialog)) { event.preventDefault(); first.focus(); }
  });
  scrim.addEventListener('click', e => { if (e.target === scrim) closeSheet(); });
  document.body.appendChild(scrim);
  sheetOpen = {el:scrim, onClose, opener, roomLabelId:opener?.dataset?.roomLabels};
  app.inert = true;
  dialog.focus();
  return dialog;
}
function closeSheet(){
  if (!sheetOpen || sheetOpen.busy) return;
  const s = sheetOpen; sheetOpen = null; s.el.remove(); s.onClose && s.onClose();
  app.inert = false;
  const replacement = s.roomLabelId && [...listEl.querySelectorAll('[data-room-labels]')].find(button => button.dataset.roomLabels === s.roomLabelId);
  const target = s.opener?.isConnected ? s.opener : replacement || $('#btn-select-items');

}

/* ---------- storage backends ---------- */
let backend = null, assets = null, downloads = null;
let peerClient = null;

function makeLocal(){
  const KEY = 'memotalk.v1';
  let data = {rooms:{}, msgs:{}, seeded:false};
  try { const raw = localStorage.getItem(KEY); if (raw) data = Object.assign(data, JSON.parse(raw)); } catch(e) {}
  const save = () => {
    try { const latest=localStorage.getItem(KEY);if(latest)data.peerPresentations=JSON.parse(latest).peerPresentations||{};localStorage.setItem(KEY, JSON.stringify(data)); }
    catch(e){ throw new Error('quota'); }
  };
  let roomCb = null; const msgCb = {};
  const emitRooms = () => roomCb && roomCb(Object.values(data.rooms).map(r => ({...r})));
  const emitMsgs = rid => msgCb[rid] && msgCb[rid]((data.msgs[rid] || []).map(m => ({...m})));
  addEventListener('storage', event => {
    if (event.key !== KEY) return;
    try {
      const next = event.newValue ? JSON.parse(event.newValue) : {rooms:{}, msgs:{}, seeded:true};
      if (!next.rooms || !next.msgs) return;
      cancelDrag(); data = next; emitRooms(); Object.keys(msgCb).forEach(emitMsgs);
    } catch (_) {}
  });
  return {
    mode:'local',
    peerSnapshot(){
      const token=localStorage.getItem(KEY),latest=token?JSON.parse(token):data;
      return {token,data:structuredClone(latest)};
    },
    peerCommit(token,rooms,msgs,groupId,presentation){
      if(localStorage.getItem(KEY)!==token)throw Object.assign(new Error('peer_stale'),{code:'peer_stale'});
      const latest=token?JSON.parse(token):data;
      const next={...latest,rooms,msgs,peerPresentations:{...(latest.peerPresentations||{}),[groupId]:presentation}};
      try{localStorage.setItem(KEY,JSON.stringify(next));}catch(_){throw Object.assign(new Error('quota'),{code:'quota'});}
      data=next;emitRooms();Object.keys(msgCb).forEach(emitMsgs);
    },
    async moveItems(changes){
      const raw = localStorage.getItem(KEY);
      const latest = raw ? JSON.parse(raw) : data;
      const error = validateChanges(changes, Object.values(latest.rooms));
      if (error) { data = latest; emitRooms(); throw new Error(error); }
      const next = {...latest, rooms:{...latest.rooms}};
      for (const change of changes) next.rooms[change.id] = {...next.rooms[change.id], [change.field]:change.to};
      try { localStorage.setItem(KEY, JSON.stringify(next)); }
      catch (_) { throw new Error('quota'); }
      data = next; emitRooms();
    },
    watchRooms(cb){ roomCb = cb; setTimeout(emitRooms); return () => { roomCb = null; }; },
    watchMsgs(rid, cb){ msgCb[rid] = cb; setTimeout(() => emitMsgs(rid)); return () => { delete msgCb[rid]; }; },
    async loadMsgs(rid){ return (data.msgs[rid] || []).map(m => ({...m})); },
    async loadAllMsgs(rid){ return (data.msgs[rid] || []).map(m => ({...m})); },
    async isSeeded(){ return !!data.seeded; },
    async markSeeded(){ data.seeded = true; try { save(); } catch(e) {} },
    async setRoom(room){ const old = data.rooms[room.id]; data.rooms[room.id] = {...room}; try { save(); } catch(e){ if (old) data.rooms[room.id] = old; else delete data.rooms[room.id]; throw e; } emitRooms(); },
    async updateRoom(id, patch){ if (!data.rooms[id]) return; const old = {...data.rooms[id]}; Object.assign(data.rooms[id], patch); try { save(); } catch(e){ data.rooms[id] = old; throw e; } emitRooms(); },
    async deleteRoom(id){ const oldRoom = data.rooms[id], oldMsgs = data.msgs[id]; delete data.rooms[id]; delete data.msgs[id]; try { save(); } catch(e){ if (oldRoom) data.rooms[id] = oldRoom; if (oldMsgs) data.msgs[id] = oldMsgs; throw e; } emitRooms(); },
    async setMsg(rid, msg){
      const a = data.msgs[rid] || (data.msgs[rid] = []);
      const i = a.findIndex(m => m.id === msg.id); const previous = i >= 0 ? {...a[i]} : null; if (i >= 0) a[i] = {...msg}; else a.push({...msg});
      a.sort((x, y) => x.ts - y.ts);
      try { save(); } catch(e){ if (i >= 0) a[i] = previous; else a.splice(a.findIndex(m => m.id === msg.id), 1); a.sort((x,y) => x.ts - y.ts); throw e; }
      emitMsgs(rid);
    },
    async updateMsg(rid, id, patch){ const m = (data.msgs[rid] || []).find(m => m.id === id); if (!m) return; const old = {...m}; Object.assign(m, patch); try { save(); } catch(e){ Object.keys(m).forEach(k => delete m[k]); Object.assign(m, old); throw e; } emitMsgs(rid); },
    async deleteMsg(rid, id){ const a = data.msgs[rid] || []; const i = a.findIndex(m => m.id === id); if (i < 0) return; const old = a.splice(i, 1)[0]; try { save(); } catch(e){ a.splice(i, 0, old); throw e; } emitMsgs(rid); },
    async applyTransfer(operations){
      const raw=localStorage.getItem(KEY), latest=raw ? JSON.parse(raw) : data;
      const next=JSON.parse(JSON.stringify(latest));
      for(const op of operations){
        const current=op.type==='room'?next.rooms[op.value.id]:(next.msgs[op.rid]||[]).find(m=>m.id===op.value.id);
        if(Object.prototype.hasOwnProperty.call(op,'expected') && JSON.stringify(current||null)!==JSON.stringify(op.expected||null))throw new Error('transfer_stale');
        if(op.type==='room')next.rooms[op.value.id]=op.value;
        else if(op.type==='msg'){
          const list=next.msgs[op.rid]||(next.msgs[op.rid]=[]);
          const index=list.findIndex(m=>m.id===op.value.id);
          if(index<0)list.push(op.value); else list[index]=op.value;
          list.sort((a,b)=>a.ts-b.ts);
        }
      }
      try{localStorage.setItem(KEY,JSON.stringify(next));}catch(_){throw new Error('quota');}
      data=next;emitRooms();Object.keys(msgCb).forEach(emitMsgs);
    },
  };
}

function makeDb(db, uid){
  const base = db.doc(`data/users/${uid}/app`);
  const roomsCol = base.collection('rooms');
  const msgsCol = rid => roomsCol.doc(rid).collection('msgs');
  const rows = s => s.docs.map(d => ({...d.data(), id:d.id}));
  const strip = o => { const r = {}; for (const k in o) if (k !== 'id' && o[k] !== undefined) r[k] = o[k]; return r; };
  const queues = {};
  const q = (key, fn) => { const p = (queues[key] || Promise.resolve()).catch(() => {}).then(fn); queues[key] = p; return p; };
  const fail = e => toast(e && e.code === 'quota_exceeded' ? '저장 공간이 부족해요.' : '연결이 끊겼어요. 잠시 후 다시 열어 주세요.');
  return {
    mode:'db',
    watchRooms(cb){ return roomsCol.limit(500).onSnapshot(s => cb(rows(s)), fail); },
    watchMsgs(rid, cb){ return msgsCol(rid).orderBy('ts', 'desc').limit(1000).onSnapshot(s => cb(rows(s).reverse()), fail); },
    async loadMsgs(rid){ const s = await msgsCol(rid).orderBy('ts', 'desc').limit(1000).get(); return rows(s).reverse(); },
    // Read every page when preserving or exporting data; the live display can remain capped.
    async loadAllMsgs(rid){
      const all = []; let cursor = null;
      while (true){
        let query = msgsCol(rid).orderBy('ts', 'desc').limit(500);
        if (cursor) query = query.startAfter(cursor);
        const snap = await query.get();
        all.push(...rows(snap));
        if (snap.docs.length < 500) break;
        cursor = snap.docs[snap.docs.length - 1];
      }
      return all.reverse();
    },
    async isSeeded(){ try { const s = await base.get(); return !!(s.exists && s.data().seeded); } catch(e){ return true; } },
    async markSeeded(){ try { await base.set({seeded:true}); } catch(e) {} },
    setRoom(room){ return q('r/' + room.id, () => roomsCol.doc(room.id).set(strip(room))); },
    updateRoom(id, patch){ return q('r/' + id, () => roomsCol.doc(id).update(strip(patch))); },
    async deleteRoom(id){
      const list = await this.loadAllMsgs(id);
      for (let i = 0; i < list.length; i += 12) await Promise.all(list.slice(i, i+12).map(m => msgsCol(id).doc(m.id).delete()));
      await q('r/' + id, () => roomsCol.doc(id).delete());
    },
    setMsg(rid, msg){ return q('m/' + msg.id, () => msgsCol(rid).doc(msg.id).set(strip(msg))); },
    updateMsg(rid, id, patch){ return q('m/' + id, () => msgsCol(rid).doc(id).update(strip(patch))); },
    deleteMsg(rid, id){ return q('m/' + id, () => msgsCol(rid).doc(id).delete()); },
    async applyTransfer(operations){
      const undo=[];
      try{
        for(const op of operations){
          if(op.type==='room'){
            const old=await roomsCol.doc(op.value.id).get();
            if(Object.prototype.hasOwnProperty.call(op,'expected') && JSON.stringify(old.exists?{...old.data(),id:op.value.id}:null)!==JSON.stringify(op.expected||null))throw new Error('transfer_stale');
            undo.push({type:'room',id:op.value.id,old:old.exists?{...old.data(),id:op.value.id}:null});
            await this.setRoom(op.value);
          }else if(op.type==='msg'){
            const old=await msgsCol(op.rid).doc(op.value.id).get();
            if(Object.prototype.hasOwnProperty.call(op,'expected') && JSON.stringify(old.exists?{...old.data(),id:op.value.id}:null)!==JSON.stringify(op.expected||null))throw new Error('transfer_stale');
            undo.push({type:'msg',rid:op.rid,id:op.value.id,old:old.exists?{...old.data(),id:op.value.id}:null});
            await this.setMsg(op.rid,op.value);
          }
        }
      }catch(error){
        for(const op of undo.reverse())try{
          if(op.type==='room')op.old?await this.setRoom(op.old):await roomsCol.doc(op.id).delete();
          else op.old?await this.setMsg(op.rid,op.old):await this.deleteMsg(op.rid,op.id);
        }catch(_){}
        throw error;
      }
    },
  };
}

const VAULT_DB='memotalk-safety-v17', VAULT_INTERVAL=24*60*60*1000, VAULT_KEEP=20, TRASH_DAYS=30;
let vaultAutoTimer=null, vaultBackupBusy=null;
async function vaultOpen(){
  if(typeof indexedDB==='undefined')throw new Error('vault_unavailable');
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(VAULT_DB,1);
    req.onupgradeneeded=()=>{
      for(const name of ['snapshots','trash'])if(!req.result.objectStoreNames.contains(name))req.result.createObjectStore(name,{keyPath:'id'});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('vault_unavailable'));
    req.onblocked=()=>reject(new Error('vault_blocked'));
  });
}
async function vaultAction(store,operation,payload){
  const db=await vaultOpen();
  try{return await new Promise((resolve,reject)=>{
    const transaction=db.transaction(store,operation==='get'||operation==='all'?'readonly':'readwrite');
    const os=transaction.objectStore(store);
    const req=operation==='put'?os.put(payload):operation==='delete'?os.delete(payload):operation==='get'?os.get(payload):os.getAll();
    let result;
    req.onsuccess=()=>{result=req.result;};
    transaction.oncomplete=()=>resolve(result);
    transaction.onerror=()=>reject(transaction.error||new Error('vault_write'));
    transaction.onabort=()=>reject(transaction.error||new Error('vault_abort'));
  });}finally{db.close();}
}
const vaultPut=(store,record)=>vaultAction(store,'put',record);
const vaultDelete=(store,id)=>vaultAction(store,'delete',id);
const vaultGet=(store,id)=>vaultAction(store,'get',id);
async function vaultAll(store){const list=await vaultAction(store,'all');return list.sort((a,b)=>(b.deletedAt||b.createdAt)-(a.deletedAt||a.createdAt));}
async function portableMessages(messages){
  const result=[];
  for(const message of messages){
    const clone=structuredClone(message);
    if(clone.images?.length){
      clone.images=[];
      for(const image of message.images){
        const data=await imageDataUrl(image);
        if(!data||!data.startsWith('data:image/'))throw new Error('backup_image_missing');
        clone.images.push({data,w:image.w,h:image.h});
      }
    }
    result.push(clone);
  }
  return result;
}

function validLocalSnapshot(raw){
  try{const value=JSON.parse(raw);return !!(value&&value.rooms&&typeof value.rooms==='object'&&value.msgs&&typeof value.msgs==='object');}catch(_){return false;}
}
function rawToPortableBackup(raw,ts){
  const data=JSON.parse(raw), all=Object.values(data.rooms||{});
  const out={app:'memotalk',version:3,exportedAt:ts,folders:[],rooms:[],archives:[]};
  for(const item of all){
    if(item.kind==='folder')out.folders.push({id:item.id,name:item.name,parentId:item.parentId||null});
    if(item.kind==='folder'||item.kind==='archive')continue;
    const msgs=(data.msgs[item.id]||[]).map(m=>structuredClone(m));
    const archive=(data.msgs[archiveRoomId(item.id)]||[]).map(m=>structuredClone(m));
    for(const m of [...msgs,...archive])for(const image of m.images||[]){if(!image.data||!image.data.startsWith('data:image/'))throw new Error('backup_image_missing');}
    out.rooms.push({id:item.id,name:item.name,tags:item.tags||[],folderId:item.folderId||null,createdAt:item.createdAt,updatedAt:item.updatedAt,pinned:!!item.pinned,msgs});
    if(archive.length)out.archives.push({roomId:item.id,msgs:archive});
  }
  return out;
}
async function saveExternalVaultCopy(snapshot){
  // Only when a previously verified actual-file mirror is linked; never prompt automatically.
  if(peerClient?.active||!fileMirror.handle||!fileMirror.auto)return false;
  if(!await ensureMirrorPermission(fileMirror.handle,false))return false;
  const index=await readMirrorIndex(fileMirror.handle);
  if(!index||index.linkId!==fileMirror.linkId)return false;
  const backup=JSON.stringify(rawToPortableBackup(snapshot.raw,snapshot.createdAt));
  const name=`Backups/MemoTalk-auto-${new Date(snapshot.createdAt).toISOString().replace(/[:.]/g,'-')}.json`;

}
async function createVaultSnapshot(reason='자동 백업',force=false){
  if(backend?.mode!=='local')throw new Error('vault_local_only');
  if(vaultBackupBusy){
    await vaultBackupBusy;
    if(!force)return null;
  }
  vaultBackupBusy=(async()=>{
    const existing=await vaultAll('snapshots');
    if(!force&&existing.some(x=>x.reason==='자동 백업'&&Date.now()-x.createdAt<VAULT_INTERVAL))return null;
    const raw=localStorage.getItem('memotalk.v1');
    if(!validLocalSnapshot(raw))throw new Error('backup_invalid');
    const snapshot={id:newId(),createdAt:Date.now(),reason,raw};
    await vaultPut('snapshots',snapshot);
    // Failed retention cleanup must not invalidate a newly committed snapshot.
    const list=await vaultAll('snapshots');
    for(const old of list.slice(VAULT_KEEP))await vaultDelete('snapshots',old.id).catch(()=>{});
    try{snapshot.externalSaved=await saveExternalVaultCopy(snapshot);}catch(_){snapshot.externalSaved=false;}
    if(snapshot.externalSaved)await vaultPut('snapshots',snapshot).catch(()=>{});
    return snapshot;
  })();
  try{return await vaultBackupBusy;}finally{vaultBackupBusy=null;}
}

async function restoreVaultTrash(record){
  const p=record.payload;
  if(record.kind==='comment'){
    const memo=(await backend.loadAllMsgs(p.roomId)).find(m=>m.id===p.memoId);
    if(!memo)throw new Error('missing_parent');
    const comments=Array.isArray(memo.comments)?memo.comments.slice():[];
    if(comments.some(c=>c.id===p.comment.id))throw new Error('exists');
    comments.push(p.comment);comments.sort((a,b)=>a.ts-b.ts);
    await backend.updateMsg(p.roomId,p.memoId,{comments});
  }else if(record.kind==='memo'){
    if(!S.rooms.some(r=>r.id===p.roomId))throw new Error('missing_parent');
    if((await backend.loadAllMsgs(p.roomId)).some(m=>m.id===p.memo.id))throw new Error('exists');
    const memo={...p.memo,images:await adaptTransferImages(p.memo.images||[],new Set())};
    await backend.setMsg(p.roomId,memo);
    await backend.updateRoom(p.roomId,{last:preview(memo),updatedAt:Date.now()});
  }else if(record.kind==='room'||record.kind==='folder'||record.kind==='folderTree'){
    const folders=record.kind==='folderTree'?p.folders:record.kind==='folder'?[p.folder]:[];
    const rooms=record.kind==='room'?[p]:record.kind==='folderTree'?p.rooms:[];
    const currentIds=new Set([...S.folders,...S.rooms,...S.archives].map(x=>x.id));
    for(const f of folders)if(currentIds.has(f.id))throw new Error('exists');
    for(const r of rooms)if(currentIds.has(r.room.id)||currentIds.has(archiveRoomId(r.room.id)))throw new Error('exists');
    // Folders first; the existing original IDs preserve hierarchy and memo relations.
    const folderIds=new Set(folders.map(f=>f.id));
    for(const f of folders){
      const parent=f.parentId&&(folderIds.has(f.parentId)||S.folders.some(x=>x.id===f.parentId))?f.parentId:null;
      await backend.setRoom({...f,parentId:parent});
    }
    for(const r of rooms){
      const folderId=r.room.folderId&&(folderIds.has(r.room.folderId)||S.folders.some(x=>x.id===r.room.folderId))?r.room.folderId:null;
      await backend.setRoom({...r.room,folderId});
      for(const memo of r.messages){const image=await adaptTransferImages(memo.images||[],new Set());await backend.setMsg(r.room.id,{...memo,images:image});}
      if(r.archives.length){
        const id=archiveRoomId(r.room.id);
        await backend.setRoom({id,kind:'archive',createdAt:Date.now()});
        for(const memo of r.archives){const image=await adaptTransferImages(memo.images||[],new Set());await backend.setMsg(id,{...memo,images:image});}
      }
    }
  }else throw new Error('unknown_trash');
  await vaultDelete('trash',record.id);
  S.gcache=null;
}

const roomTags = r => Array.isArray(r?.tags) ? r.tags : [];

const sameTag = (a, b) => a.toLowerCase() === b.toLowerCase();
function normTags(arr){
  const out = [], seen = new Set();
  for (let t of arr){
    t = String(t).replace(/^#+/, '').trim().replace(/\s+/g, '_').slice(0, 20);
    if (!t || seen.has(t.toLowerCase())) continue;
    seen.add(t.toLowerCase()); out.push(t);
  }
  return out.slice(0, 10);
}
function allTags(){
  const m = new Map();
  for (const r of S.rooms) for (const t of roomTags(r)){
    const k = t.toLowerCase(); const e = m.get(k) || {name:t, n:0}; e.n++; m.set(k, e);
  }
  return [...m.values()].sort((a, b) => b.n - a.n || a.name.localeCompare(b.name, 'ko'));
}

const ROOM_ORDER_KEY = 'memotalk.v17.roomOrder';
let savedRoomOrder = {};
try {
  const restored = JSON.parse(localStorage.getItem(ROOM_ORDER_KEY) || '{}');
  if (restored && typeof restored === 'object' && !Array.isArray(restored)) savedRoomOrder = restored;
} catch (_) {}
const roomOrderGroup = folderId => 'rooms:' + (folderId || '__root__');
function roomsInSavedOrder(rooms, folderId) {
  const saved = savedRoomOrder[roomOrderGroup(folderId)];
  if (!Array.isArray(saved) || !saved.length) return rooms;
  const ranks = new Map(saved.map((id, i) => [id, i]));
  return rooms.slice().sort((a, b) => {
    const aRank = ranks.get(a.id), bRank = ranks.get(b.id);
    if (aRank === undefined && bRank === undefined) return 0;
    if (aRank === undefined) return -1;
    if (bRank === undefined) return 1;
    return aRank - bRank;
  });
}

let suppressClick = false;
function bindLongPress(container, selector, fn, ignoreSelector=''){
  let timer = null, sx = 0, sy = 0, target = null;
  const clear = () => { clearTimeout(timer); timer = null; };
  container.addEventListener('pointerdown', e => {
    if (e.button > 0 || (ignoreSelector && e.target.closest(ignoreSelector))) return;
    target = e.target.closest(selector); if (!target) return;
    sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => { timer = null; suppressClick = true; setTimeout(() => suppressClick = false, tuning.clickGuard); if (!sheetOpen) fn(target); }, tuning.hold);
  });
  container.addEventListener('pointermove', e => { if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > tuning.slop) clear(); });
  ['pointerup','pointercancel','pointerleave'].forEach(t => container.addEventListener(t, clear));
  container.addEventListener('contextmenu', e => {
    const t = e.target.closest(selector); if (!t) return;
    if (e.target.closest('a') || (ignoreSelector && e.target.closest(ignoreSelector))) return;
    e.preventDefault(); clear(); if (!sheetOpen) fn(t);
  });
}

async function deleteRoomWithArchive(id,{trash=true}={}){

async function ensureAllMsgs(){
  if (S.gcache) return S.gcache;
  if (gLoading) return gLoading;
  gLoading = (async () => {
    const out = {};
    for (const r of S.rooms) out[r.id] = r.id === S.cur ? S.msgs : await backend.loadMsgs(r.id);
    S.gcache = out; gLoading = null; return out;

}
function parseQuery(q){
  const tags = [];
  const text = q.replace(/#([^\s#]+)/g, (_, t) => { tags.push(t.toLowerCase()); return ' '; }).replace(/\s+/g, ' ').trim();
  return {tags, text};
}
async function renderGlobalResults(){
  const q = S.gq, {tags, text} = parseQuery(q), tl = text.toLowerCase();
  const inScope = r => tags.every(t => roomTags(r).some(x => x.toLowerCase().startsWith(t)));
  const scoped = sortedRooms().filter(inScope);
  const scopeLabel = tags.length ? tags.map(t => '#' + t).join(' ') + ' 라벨 안에서 ' : '';
  const roomRow = r => `<div class="room-entry"><button class="room gut" data-id="${esc(r.id)}"><span class="av" style="background:${avColor(r.id)}">${esc(Array.from(r.name)[0])}</span><span class="rmain"><span class="rtop"><span class="rname">${hl(r.name, text)}</span>${roomTags(r).length ? `<span class="rtags">${hl(tagStr(r), text)}</span>` : ''}</span><span class="rlast">${esc(r.last || '메모 없음')}</span></span></button>${roomLabelButton(r)}</div>`;
  if (!text){
    listEl.innerHTML = `<div class="section-label gut">${esc(scopeLabel)}채팅방 ${scoped.length}개</div>` + (scoped.length ? scoped.map(roomRow).join('') : `<div class="empty"><p>이 라벨이 붙은 채팅방이 없어요.</p></div>`);
    return;
  }
  const rooms = scoped.filter(r => r.name.toLowerCase().includes(tl) || roomTags(r).some(t => t.toLowerCase().includes(tl)));
  if (!S.gcache) listEl.innerHTML = `<div class="empty"><p>찾는 중…</p></div>`;
  let all;
  try { all = await ensureAllMsgs(); } catch(e){ listEl.innerHTML = `<div class="empty"><p>검색하지 못했어요. 연결을 확인해 주세요.</p></div>`; return; }
  if (q !== S.gq) return;
  const hits = [];
  for (const r of scoped) for (const m of all[r.id] || []) if ((m.text || '').toLowerCase().includes(tl)) hits.push({r, m});
  hits.sort((a, b) => b.m.ts - a.m.ts);
  const snip = t => { const i = t.toLowerCase().indexOf(tl); const s = Math.max(0, i - 24); return (s ? '…' : '') + t.slice(s, i + text.length + 60).replace(/\n/g, ' '); };
  let html = '';
  if (rooms.length) html += `<div class="section-label gut">채팅방</div>` + rooms.map(roomRow).join('');
  html += `<div class="section-label gut">${esc(scopeLabel)}메모 ${hits.length}개</div>`;
  html += hits.length ? hits.slice(0, 200).map(({r, m}) => `<button class="hit gut" data-room="${esc(r.id)}" data-msg="${esc(m.id)}" data-q="${esc(text)}"><span class="hroom"><b>${esc(r.name)}</b><span>${esc(listTime(m.ts))}</span></span><span class="htext">${hl(snip(m.text), text)}</span></button>`).join('')
    : `<div class="empty"><p>'${esc(text)}'이(가) 들어간 메모가 없어요.</p></div>`;
  listEl.innerHTML = html;
}

function editMemoComment(memoId,commentId){

    const comments=Array.isArray(latest.comments)?latest.comments.slice():[];
    if(!comments.some(c=>c.id===commentId))throw new Error('comment_missing');
    const removed=comments.find(c=>c.id===commentId);

    if(remaining.length)openCommentIds.add(memoId);else openCommentIds.delete(memoId);

function renderMsgs(){

    const showTime = !next || dayKey(next.ts) !== dk || minuteKey(next.ts) !== minuteKey(m.ts) || (m.edited && !next.edited);
    const imgs = m.images || [];
    const pics = imgs.length ? `<div class="pics n${Math.min(imgs.length, 4)}">${imgs.map((im, k) => `<img loading="lazy" alt="첨부한 사진" data-k="${k}" src="${esc(imgSrc(im))}"${im.w ? ` width="${im.w}" height="${im.h}"` : ''}>`).join('')}</div>` : '';
    const bubble = m.text ? `<div class="bubble${imgs.length ? '' : ' lead'}">${renderText(m.text, q)}</div>` : '';

    const meta = (memoLayoutMode === 'grid' || showTime) ? `<div class="meta">${m.edited ? '<span>수정됨</span>' : ''}<span>${esc(fTime.format(new Date(m.ts)))}</span></div>` : (m.edited ? `<div class="meta"><span>수정됨</span></div>` : '');
    html += `<div class="row${first ? ' first gap' : ''}${curHit === m.id ? ' cur' : ''}" data-id="${esc(m.id)}"${memoLayoutMode === 'grid' ? ' tabindex="0" role="button" aria-label="메모 펼쳐 보기"' : ''}>${meta}<div class="content">${pics}${bubble}${conflictButton}${memoCommentsHtml(m)}</div></div>`;
  });
  msgsEl.innerHTML = html;

  S.forceBottom = false;
}

function memoSentenceUnits(text){
  const source=String(text||'');
  const chunks=typeof Intl.Segmenter==='function'
    ? [...new Intl.Segmenter('ko',{granularity:'sentence'}).segment(source)].map(x=>x.segment)
    : source.split(/(?<=[.!?。！？])\s+/u);
  return chunks.flatMap(chunk=>chunk.split(/\r?\n/).map(part=>part.trim()).filter(Boolean));
}

// Android already accounts for both IME + navigation bar in the NATIVE

function layoutForVisibleKeyboard(){
  cancelAnimationFrame(memoKeyboardFrame);
  memoKeyboardFrame = requestAnimationFrame(() => {
    if (!memoIsAndroidApp) {
      const vv = window.visualViewport;
      // Desktop and standalone Electron retain their ordinary 100% layout.
      // On touch browsers with the software keyboard, use its visible height.
      if (vv && matchMedia('(pointer:coarse)').matches) {

        document.documentElement.style.setProperty('--memo-visible-height', visible + 'px');

async function addFiles(files){
  if (S.editing) return toast('수정 중에는 사진을 붙일 수 없어요.');
  const room = 10 - S.pending.length;
  if (files.length > room) toast('한 번에 사진은 10장까지 보낼 수 있어요.');
  for (const f of files.slice(0, Math.max(0, room))){
    const url = URL.createObjectURL(f);
    try {
      const c = await drawScaled(url, 1600);
      const blob = await canvasBlob(c, .86);
      S.pending.push({blob, url: URL.createObjectURL(blob), w:c.width, h:c.height});
    } catch(e){ toast('이 사진은 열 수 없어요.'); }
    finally { URL.revokeObjectURL(url); }
  }
  renderPending(); updateSend();
}
function renderPending(){
  const el = $('#pending');
  el.hidden = !S.pending.length;
  el.innerHTML = S.pending.map((p, i) => `<div class="pthumb"><img alt="보낼 사진 ${i+1}" src="${p.url}"><button data-i="${i}" aria-label="사진 빼기">${I.close}</button></div>`).join('');
}

async function storeImage(p, count){
  if (assets){
    try { const up = await assets.upload(p.blob); return {asset:up.id, w:p.w, h:p.h}; }
    catch(e){ /* fall through to inline */ }
  }
  if (backend.mode === 'db') return inlineFit(p.url, Math.floor(220000 / count));
  const c = await drawScaled(p.url, 1280); return {data:c.toDataURL('image/jpeg', .8), w:c.width, h:c.height};

function startEdit(m){

function cancelEdit(){
  if (!S.editing) return;
  S.editing = null; $('#editbar').hidden = true; input.value = ''; autosize(); updateSend();
}
$('#edit-cancel').addEventListener('click', cancelEdit);

async function send(){
  if (S.sending || !S.cur) return;
  const rid = S.cur;
  // Snapshot the exact input. The outgoing text is normalized, but the visible
  // composer may still contain spaces or a trailing newline.
  const originalInput = input.value;
  const revisionAtSend = composerRevision;
  const text = originalInput.replace(/^\s*\n|\s+$/g, '');
  if (S.editing){
    const ed = S.editing;
    if (!text.trim()) return toast('내용이 비어 있어요. 지우려면 메모를 길게 눌러 삭제해 주세요.');
    if (text === ed.text){ cancelEdit(); return; }
    S.sending = true; updateSend();
    try {
      await backend.updateMsg(rid, ed.id, {text, edited:Date.now()});
      const isLast = S.msgs[S.msgs.length-1]?.id === ed.id;
      if (isLast) backend.updateRoom(rid, {last:preview({text})}).catch(() => {});
      cancelEdit(); S.gcache = null;
    } catch(e){ toast('수정하지 못했어요. 다시 시도해 주세요.'); }
    finally { S.sending = false; updateSend(); }
    return;
  }
  if (!text.trim() && !S.pending.length) return;
  S.sending = true; updateSend();
  const pend = S.pending.slice();
  try {
    const images = [];
    for (const p of pend) images.push(await storeImage(p, pend.length));
    const ts = Date.now();
    const msg = {id:newId(), ts, text: text.trim() ? text : ''};
    if (images.length) msg.images = images;
    S.forceBottom = true; memoUserReading = false;
    await backend.setMsg(rid, msg);
    // Only clear the text submitted by this send. It must have been saved,
    // and the user must not have typed again while that save was pending.
    if (S.cur === rid && !S.editing &&
        composerRevision === revisionAtSend && input.value === originalInput) {
      input.value = '';
      autosize();
    }
    if (S.drafts[rid] === originalInput || !S.drafts[rid]) S.drafts[rid] = '';
    // Remove only attachments that actually went out; keep newer attachments.
    S.pending = S.pending.filter(p => !pend.includes(p));
    pend.forEach(p => URL.revokeObjectURL(p.url));
    renderPending();
    S.gcache = null;
    backend.updateRoom(rid, {last:preview(msg), updatedAt:ts}).catch(() => {});
  } catch(e){
    autosize();
    toast(e && e.message === 'quota' ? '이 기기의 저장 공간이 가득 찼어요. 사진이 많은 메모를 지우거나 백업한 뒤 정리해 주세요.' : '보내지 못했어요. 연결을 확인하고 다시 보내 주세요.');
  } finally { S.sending = false; updateSend(); }
}

/* ---------- actual-device Markdown file mirror ---------- */
// The browser's private storage stays authoritative. Physical files are a local copy.
// No cross-device sync or external Markdown import is performed in this stage.
const FILE_MIRROR_INDEX='.memotalk-file-index.json';
const FILE_MIRROR_DB='memotalk-file-folder-v1';
let fileMirrorDelay=FILE_MIRROR_DELAY;
try{const saved=localStorage.getItem('memotalk.fileMirror.delay');if(saved!==null&&Number.isFinite(Number(saved)))fileMirrorDelay=Math.max(FILE_MIRROR_DELAY_MIN,Math.min(FILE_MIRROR_DELAY_MAX,Number(saved)));}catch(_){}
const fileMirror={handle:null,linkId:null,timer:null,pending:false,busy:false,dirty:false,status:'off',message:'파일 폴더 연결 안 됨',auto:true};
try { fileMirror.auto=localStorage.getItem('memotalk.fileMirror.auto')!=='false'; fileMirror.pending=localStorage.getItem('memotalk.fileMirror.pending')==='1'; }catch(_){}
function fileMirrorStatus(status,message){
  fileMirror.status=status;fileMirror.message=message;
  const bar=$('#file-sync-bar'), label=$('#file-sync-state');
  if(!bar||!label)return;
  bar.dataset.sync=status;
  label.textContent=message;label.title=message;
  $('#btn-file-folder').disabled=fileMirror.busy;
}
const fileMirrorSupported=()=>!!window.MemoTalkFS || (typeof window.showDirectoryPicker==='function'&&!!window.isSecureContext);
async function mirrorHandleStore(action,value){
  if(window.MemoTalkFS){
    if(action==='get')return window.MemoTalkFS.restore();
    if(action==='put')return window.MemoTalkFS.put(value);
    if(action==='clear')return window.MemoTalkFS.clear();
  }
  if(typeof indexedDB==='undefined')return null;
  let db;
  try{
    db=await new Promise((resolve,reject)=>{
      const request=indexedDB.open(FILE_MIRROR_DB,1);
      request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('handles'))request.result.createObjectStore('handles');};
      request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);
    });
    return await new Promise((resolve,reject)=>{
      const transaction=db.transaction('handles',action==='get'?'readonly':'readwrite'),store=transaction.objectStore('handles');
      const request=action==='get'?store.get('folder'):action==='clear'?store.delete('folder'):store.put(value,'folder');
      request.onsuccess=()=>resolve(request.result||null);request.onerror=()=>reject(request.error);
    });
  }catch(_){return null;}
  finally{db?.close();}
}
async function restoreFileMirrorHandle(){
  if(!fileMirrorSupported()){
    fileMirrorStatus('off','이 브라우저는 직접 폴더 쓰기 미지원 · ZIP 저장 가능');return;
  }
  const saved=await mirrorHandleStore('get');
  if(!saved||!saved.handle){fileMirrorStatus('off','파일 폴더 미연결 · 파일 저장 버튼');return;}
  fileMirror.handle=saved.handle;fileMirror.linkId=saved.linkId;
  try{
    const permission=await fileMirror.handle.queryPermission({mode:'readwrite'});
    fileMirrorStatus('pending',permission==='granted'?`${fileMirror.handle.name} · 연결 복원됨 · 저장본 검증 전${fileMirror.pending?' · 이전 변경 사항 반영 대기':''}`:`${fileMirror.handle.name} · 파일 접근 권한 확인 필요`);
  }catch(_){fileMirrorStatus('pending','파일 폴더 권한을 다시 허용해 주세요.');}
}
function scheduleFileMirror(){
  if(peerClient?.active){peerClient.schedule();return;}
  if(!fileMirror.handle)return;
  fileMirror.pending=true;
  try{localStorage.setItem('memotalk.fileMirror.pending','1');}catch(_){}
  fileMirrorStatus('pending',fileMirror.auto?`${fileMirror.handle.name} · 변경 내용 파일 반영 대기`:`${fileMirror.handle.name} · 저장 필요 (파일 저장 버튼)`);
  clearTimeout(fileMirror.timer);
  if(!fileMirror.auto)return;
  fileMirror.timer=setTimeout(()=>{
    if(!S.roomsLoaded){scheduleFileMirror();return;}
    runFileMirror(false).catch(()=>{});
  },fileMirrorDelay);
}
function enableFileMirrorChangeTracking(){
  for(const method of ['setRoom','updateRoom','deleteRoom','setMsg','updateMsg','deleteMsg','moveItems','applyTransfer']){
    const original=backend[method];if(typeof original!=='function')continue;
    backend[method]=async function(...args){
      const result=await original.apply(this,args);
      scheduleFileMirror();
      scheduleVaultAutoBackup();
      return result;
    };
  }
}
async function ensureMirrorPermission(handle,prompt=false){
  const options={mode:'readwrite'};
  let permission=typeof handle.queryPermission==='function'?await handle.queryPermission(options):'prompt';
  if(permission!=='granted'&&prompt&&typeof handle.requestPermission==='function')permission=await handle.requestPermission(options);
  return permission==='granted';
}
async function readMirrorIndex(root){
  try{
    const handle=await root.getFileHandle(FILE_MIRROR_INDEX),file=await handle.getFile();
    if(file.size>20*1024*1024)throw new Error('mirror_index');
    const doc=JSON.parse(await file.text());

    const {entries,rooms}=await buildTransferEntries(roomIds,(done,total)=>toast(`Markdown 묶음 만드는 중… ${done}/${total}`,true));

function transferPath(files,prefix,relative){
  if(typeof relative!=='string'||relative.startsWith('/')||relative.includes('\\')||relative.split('/').some(part=>part==='..'||part==='.')||!files.has(`${prefix}/${relative}`))throw new Error('transfer_format');

}
async function decodeTransferImage(files,prefix,item){

  const file=transferPath(files,prefix,item.path), blob=new Blob([file],{type:item.mime});

}
async function sameImages(a,b){

  for(let i=0;i<(a||[]).length;i++)if(await imageDataUrl(a[i])!==b[i].data)return false;
  return true;
}
async function adaptTransferImages(images,uploadedAssets){
  if(backend.mode!=='db')return images;
  const out=[];
  for(const im of images){
    if(assets){try{const uploaded=await assets.upload(dataUrlToBlob(im.data));uploadedAssets.add(uploaded.id);out.push({asset:uploaded.id,w:im.w,h:im.h});continue;}catch(_){}}

// Outside Claude (the file opened directly in a browser) a plain download link works.
const standalone = !window.claude;
async function needDownloads(){
  if (downloads || standalone) return true;
  toast('이 화면에서는 파일 저장을 할 수 없어요. claude.ai에서 열어 주세요.');
  return false;
}
async function saveFile(filename, data){
  if(window.MemoTalkFS){
    try {
      const blob = data instanceof Blob ? data : new Blob([data], {type:'application/octet-stream'});
      await window.MemoTalkFS.download(filename, blob);
      toast('파일을 저장했어요.');
    } catch(error) { if(error?.message!=='cancelled')toast('저장할 파일 위치를 선택하지 못했어요.'); }
    return;
  }
  if (!downloads && standalone){
    const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith('.json') ? 'application/json' : filename.endsWith('.zip') ? 'application/zip' : 'text/html'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return toast('저장했어요.');
  }
  try { await downloads.save({filename, data}); toast('저장했어요.'); }
  catch(e){
    if (e?.code === 'declined') return hideToast();
    toast(e?.code === 'too_large' ? '파일이 너무 커서 저장하지 못했어요.' : '파일을 저장하지 못했어요.');
  }
}
const stamp = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const safeName = s => s.replace(/[\\/:*?"<>|\n\r\t]+/g, ' ').trim().slice(0, 60) || '채팅방';

async function imageDataUrl(im){
  if (!im.asset) return im.data || '';
  const res = await fetch('/_blob/' + im.asset);
  if (!res.ok) throw new Error('img');
  return blobToDataUrl(await res.blob());
}

async function exportHtml(ids){
