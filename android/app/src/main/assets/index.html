async function importJsonV3(data){
  const folderMap=new Map(),roomMap=new Map(),memoMap=new Map(),archiveMap=new Map(),uploadedAssets=new Set(),ops=[];
  try{
    for(const f of data.folders||[])if(f&&typeof f.id==='string')folderMap.set(f.id,newId());
    for(const r of data.rooms){
      if(!r||typeof r.id!=='string'||!Array.isArray(r.msgs))throw new Error('backup_format');
      roomMap.set(r.id,newId());
      for(const m of r.msgs)if(m&&typeof m.id==='string')memoMap.set(m.id,newId());
    }
    for(const group of data.archives||[])for(const a of group.msgs||[])if(a&&typeof a.id==='string')archiveMap.set(a.id,newId());
    for(const f of data.folders||[])if(folderMap.has(f.id))ops.push({type:'room',expected:null,value:{id:folderMap.get(f.id),kind:'folder',name:String(f.name||'폴더').slice(0,40),parentId:folderMap.get(f.parentId)||null,createdAt:Date.now()}});
    for(const r of data.rooms){
      const id=roomMap.get(r.id), sorted=r.msgs.slice().sort((a,b)=>a.ts-b.ts),last=sorted[sorted.length-1];
      ops.push({type:'room',expected:null,value:{id,name:String(r.name||'메모방').slice(0,40),folderId:folderMap.get(r.folderId)||null,tags:normTags(Array.isArray(r.tags)?r.tags:[]),createdAt:r.createdAt||Date.now(),updatedAt:r.updatedAt||last?.ts||Date.now(),pinned:!!r.pinned,last:last?preview(last):''}});
      for(const m of sorted){
        if(!memoMap.has(m.id))throw new Error('backup_format');
        if((m.conflicts||[]).some(ref=>!archiveMap.has(ref.id)))throw new Error('backup_format');
        const images=[];for(const im of m.images||[]){if(typeof im.data!=='string'||!im.data.startsWith('data:image/'))throw new Error('backup_format');images.push({data:im.data,w:im.w,h:im.h});}
        const refs=mergeConflictRefs((m.conflicts||[]).filter(ref=>archiveMap.has(ref.id)).map(ref=>({id:archiveMap.get(ref.id),createdAt:ref.createdAt})));
        const msg={id:memoMap.get(m.id),ts:Number(m.ts)||Date.now(),text:String(m.text||''),images:await adaptTransferImages(images,uploadedAssets)};
        if(m.edited)msg.edited=m.edited;if(Array.isArray(m.comments))msg.comments=m.comments.filter(c=>c&&typeof c.text==='string').map(c=>({id:newId(),ts:Number(c.ts)||Date.now(),text:c.text,...(c.edited?{edited:Number(c.edited)}:{})}));if(refs.length)msg.conflicts=refs;if(!msg.images.length)delete msg.images;
        ops.push({type:'msg',rid:id,expected:null,value:msg});
      }
    }
    for(const group of data.archives||[]){
      const roomId=roomMap.get(group.roomId);if(!roomId)throw new Error('backup_format');
      const rid=archiveRoomId(roomId);
      ops.push({type:'room',expected:null,value:{id:rid,kind:'archive',name:'충돌 보관함',createdAt:Date.now()}});
      for(const a of group.msgs||[]){
        if(!memoMap.has(a.sourceMemoId)||!archiveMap.has(a.id))throw new Error('backup_format');
        const images=[];for(const im of a.images||[]){if(typeof im.data!=='string'||!im.data.startsWith('data:image/'))throw new Error('backup_format');images.push({data:im.data,w:im.w,h:im.h});}
        ops.push({type:'msg',rid,expected:null,value:{id:archiveMap.get(a.id),ts:Number(a.archivedAt)||Date.now(),archivedAt:Number(a.archivedAt)||Date.now(),sourceMemoId:memoMap.get(a.sourceMemoId),sourceTs:Number(a.sourceTs)||Date.now(),text:String(a.text||''),incomingText:String(a.incomingText||''),incomingImageCount:Number(a.incomingImageCount)||0,imageChanged:!!a.imageChanged,comments:Array.isArray(a.comments)?a.comments:[],images:await adaptTransferImages(images,uploadedAssets)}});
      }
    }
    await backend.applyTransfer(ops);S.gcache=null;toast('백업을 불러왔어요. 이전 내용 기록도 복원했어요.');
  }catch(error){
    for(const id of uploadedAssets)try{await assets?.delete(id);}catch(_){}
    toast(error?.message==='quota'?'저장 공간이 부족해 백업을 불러오지 못했어요.':'백업을 불러오지 못했어요. 기존 메모는 유지됩니다.');
  }
}

$('#file-backup').addEventListener('change', async e => {

  try { data = JSON.parse(await f.text()); } catch(_){ return toast('백업 파일을 읽지 못했어요. 메모톡에서 저장한 .json 파일인지 확인해 주세요.'); }

  const nMsgs = data.rooms.reduce((a, r) => a + (r.msgs?.length || 0), 0);

  if(data.version===3)return importJsonV3(data);
  const names = new Set(S.rooms.map(r => r.name));
  const folderMap=new Map();
  // Preserve directory relationships when importing v2; v1 backups simply remain unfiled.
  const importedFolders=Array.isArray(data.folders)?data.folders:[];
  try{
    for(const f of importedFolders){if(!f || typeof f.id!=='string')continue;folderMap.set(f.id,newId());}
    for(const f of importedFolders){if(!folderMap.has(f.id))continue;
      await backend.setRoom({id:folderMap.get(f.id),kind:'folder',name:String(f.name||'폴더').slice(0,40),parentId:folderMap.get(f.parentId)||null,createdAt:Date.now()});}
  }catch(_){return toast('폴더 복원 중 오류가 발생했어요. 일부 폴더가 만들어졌을 수 있어요.');} 
  let done = 0;
  try {
    for (const r of data.rooms){
      const id = newId();
      const name = names.has(r.name) ? `${r.name} (불러옴)` : String(r.name || '채팅방');
      const msgs = (r.msgs || []).slice().sort((a, b) => a.ts - b.ts);
      const lastM = msgs[msgs.length-1];
      await backend.setRoom({id, name, folderId:folderMap.get(r.folderId)||null, tags:normTags(Array.isArray(r.tags) ? r.tags : []), createdAt:r.createdAt || Date.now(), updatedAt:r.updatedAt || lastM?.ts || Date.now(), pinned:!!r.pinned, last: lastM ? preview(lastM) : ''});
      for (const m of msgs){
        toast(`불러오는 중… ${++done}/${nMsgs}`, true);
        const msg = {id:newId(), ts:+m.ts || Date.now(), text:String(m.text || '')};
        if (m.edited) msg.edited = m.edited;
        if (Array.isArray(m.comments)) msg.comments = m.comments.filter(c=>c&&typeof c.text==='string').map(c=>({id:newId(),ts:Number(c.ts)||Date.now(),text:c.text,...(c.edited?{edited:Number(c.edited)}:{})}));
        if (m.images?.length){
          msg.images = [];
          for (const im of m.images){
            if (typeof im.data !== 'string' || !im.data.startsWith('data:image/')) continue;
            if (assets){
              try { const up = await assets.upload(dataUrlToBlob(im.data)); msg.images.push({asset:up.id, w:im.w, h:im.h}); continue; } catch(_){}
            }
            if (backend.mode === 'db') msg.images.push(im.data.length <= 220000 / m.images.length ? {data:im.data, w:im.w, h:im.h} : await inlineFit(im.data, Math.floor(220000 / m.images.length)));
            else msg.images.push({data:im.data, w:im.w, h:im.h});
          }
          if (!msg.images.length) delete msg.images;
        }
        await backend.setMsg(id, msg);
      }
    }
    S.gcache = null;
    toast('백업을 불러왔어요.');
  } catch(err){
    toast(err?.message === 'quota' ? '이 기기 저장 공간이 가득 차서 일부만 불러왔어요.' : '불러오다 멈췄어요. 일부만 추가됐을 수 있어요.');
  }
});

/* ---------- PDF export (drawn on canvas, packed with jsPDF) ---------- */
function loadScript(src){
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`) && window.jspdf) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s);
  });
}
function wrapText(ctx, text, maxW){
  const out = [];
  for (const para of String(text).split('\n')){
    if (para === ''){ out.push(''); continue; }
    const toks = para.match(/\S+|\s+/g) || [''];
    let line = '';
    for (const tok of toks){
      if (ctx.measureText(line + tok).width <= maxW){ line += tok; continue; }
      if (/^\s+$/.test(tok)){ out.push(line); line = ''; continue; }
      if (line.trim()){ out.push(line.replace(/\s+$/, '')); line = ''; }
      if (ctx.measureText(tok).width <= maxW){ line = tok; continue; }
      let chunk = '';
      for (const ch of Array.from(tok)){
        if (chunk && ctx.measureText(chunk + ch).width > maxW){ out.push(chunk); chunk = ch; } else chunk += ch;
      }
      line = chunk;
    }
    out.push(line.replace(/\s+$/, ''));
  }
  return out;
}
function rr(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath(); ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
async function exportPdf(rid){

    const msgs = await backend.loadAllMsgs(rid);
    const FAM = '"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
    const allText = room.name + msgs.map(m => m.text || '').join('') + '0123456789오전후년월일요수정됨메모개내보냄';
    try { await Promise.all(['400','600'].map(w => document.fonts.load(`${w} 15px "IBM Plex Sans KR"`, allText.slice(0, 20000)))); } catch(_){}

      const src = imgSrc(im); if (!src || pics.has(src)) continue;
      try { pics.set(src, await loadImg(src)); } catch(_){ pics.set(src, null); }
    }
    const PW = 794, PH = 1123, M = 56, R = PW - M, BOTTOM = PH - 64;
    const C = {ink:'#1B1E24', sub:'#6B7380', faint:'#9AA1AD', rule:'#E3E6EB', bubble:'#FFF0A6', pill:'#EEF1F5', pillInk:'#5B6473'};
    const mctx = document.createElement('canvas').getContext('2d');
    const F = (w, px) => `${w} ${px}px ${FAM}`;
    const pages = [[]]; let y = M;
    const ops = () => pages[pages.length-1];
    const newPage = () => { pages.push([]); y = M; };
    // header
    mctx.font = F(600, 24);
    for (const ln of wrapText(mctx, room.name, PW - 2*M)){ ops().push({t:'text', s:ln, x:M, y, f:F(600, 24), c:C.ink}); y += 34; }
    ops().push({t:'text', s:`${fDay.format(new Date())} 내보냄 · 메모 ${msgs.length}개${roomTags(room).length ? ' · ' + tagStr(room) : ''}`, x:M, y:y+2, f:F(400, 13), c:C.sub});
    y += 30; ops().push({t:'line', x1:M, x2:R, y}); y += 14;
    const BW = Math.round((PW - 2*M) * 0.74), PADX = 14, PADY = 9, LH = 24;
    let prevDay = null;
    for (const m of msgs){
      const dk = dayKey(m.ts);
      if (dk !== prevDay){
        if (y + 52 > BOTTOM) newPage();
        y += 12;
        const label = fDay.format(new Date(m.ts)); mctx.font = F(400, 12);
        const w = mctx.measureText(label).width + 28;
        ops().push({t:'pill', x:(PW - w)/2, y, w, h:26, s:label});
        y += 38; prevDay = dk;
      }
      let last = null; // {page, x, bottom}
      for (const im of m.images || []){
        const pic = pics.get(imgSrc(im));
        let w = 280, h = 200;
        if (pic){ const s = Math.min(300 / pic.naturalWidth, 380 / pic.naturalHeight, 1.5); w = pic.naturalWidth * s; h = pic.naturalHeight * s; }
        const maxH = BOTTOM - M;
        if (h > maxH){ w *= maxH / h; h = maxH; }
        if (y + h > BOTTOM) newPage();
        ops().push({t:'img', pic, x:R - w, y, w, h});
        last = {page:pages.length-1, x:R - w, bottom:y + h};
        y += h + 6;
      }
      if (m.text){
        mctx.font = F(400, 15);
        const lines = wrapText(mctx, m.text, BW - 2*PADX);
        const w = Math.ceil(Math.max(...lines.map(l => mctx.measureText(l).width), 8)) + 2*PADX;
        const x = R - w;
        let i = 0;
        while (i < lines.length){
          if (y + 2*PADY + LH > BOTTOM) newPage();
          const piece = {t:'bubble', x, y, w, h:0}; ops().push(piece);
          let yy = y + PADY;
          while (i < lines.length && yy + LH <= BOTTOM - PADY){ ops().push({t:'text', s:lines[i], x:x + PADX, y:yy + 4, f:F(400, 15), c:C.ink}); yy += LH; i++; }
          piece.h = yy + PADY - y; y = piece.y + piece.h;
          last = {page:pages.length-1, x, bottom:y};
          if (i < lines.length) newPage();
        }
        y += 6;
      }
      if (last){
        const label = (m.edited ? '수정됨 · ' : '') + fTime.format(new Date(m.ts));
        pages[last.page].push({t:'text', s:label, x:last.x - 7, y:last.bottom - 15, f:F(400, 11), c:C.faint, a:'right'});
      }
      y += 6;
    }
    // draw pages
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({unit:'pt', format:'a4', compress:true});
    const SC = 2, N = pages.length;
    const cv = document.createElement('canvas'); cv.width = PW*SC; cv.height = PH*SC;
    const ctx = cv.getContext('2d');
    for (let p = 0; p < N; p++){
      toast(`PDF 만드는 중… ${p+1}/${N}쪽`, true);
      await sleep(0);
      ctx.setTransform(SC, 0, 0, SC, 0, 0);
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, PW, PH);
      ctx.textBaseline = 'top';
      for (const o of pages[p]){
        ctx.textAlign = 'left';
        if (o.t === 'text'){ ctx.font = o.f; ctx.fillStyle = o.c; ctx.textAlign = o.a || 'left'; ctx.fillText(o.s, o.x, o.y); }
        else if (o.t === 'line'){ ctx.strokeStyle = C.rule; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(o.x1, o.y + .5); ctx.lineTo(o.x2, o.y + .5); ctx.stroke(); }
        else if (o.t === 'pill'){ ctx.fillStyle = C.pill; rr(ctx, o.x, o.y, o.w, o.h, 13); ctx.fill(); ctx.font = F(400, 12); ctx.fillStyle = C.pillInk; ctx.textAlign = 'center'; ctx.fillText(o.s, o.x + o.w/2, o.y + 6); }
        else if (o.t === 'bubble'){ ctx.fillStyle = C.bubble; rr(ctx, o.x, o.y, o.w, o.h, 12); ctx.fill(); }
        else if (o.t === 'img'){
          ctx.save(); rr(ctx, o.x, o.y, o.w, o.h, 10); ctx.clip();
          if (o.pic) ctx.drawImage(o.pic, o.x, o.y, o.w, o.h);
          else { ctx.fillStyle = C.pill; ctx.fillRect(o.x, o.y, o.w, o.h); ctx.font = F(400, 12); ctx.fillStyle = C.pillInk; ctx.textAlign = 'center'; ctx.fillText('사진을 불러오지 못했어요', o.x + o.w/2, o.y + o.h/2 - 7); }
          ctx.restore();
        }
      }
      ctx.font = F(400, 11); ctx.fillStyle = C.faint;
      ctx.textAlign = 'left'; ctx.fillText(room.name.length > 40 ? room.name.slice(0, 40) + '…' : room.name, M, PH - 40);
      ctx.textAlign = 'right'; ctx.fillText(`${p+1} / ${N}`, R, PH - 40);
      if (p > 0) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg', .9), 'JPEG', 0, 0, 595.28, 841.89);
    }
    await saveFile(`${safeName(room.name)}-${stamp()}.pdf`, pdf.output('blob'));
  } catch(e){
    toast(e?.message === 'script' ? 'PDF 도구를 불러오지 못했어요. 연결을 확인해 주세요.' : 'PDF를 만들지 못했어요.');
  }
}

/* ---------- boot ---------- */
async function seedIfNew(){
  if (await backend.isSeeded()) return;
  await backend.markSeeded();
  if (S.rooms.length) return;
  const now = Date.now(), id = newId();
  const lines = [
    '메모톡에 오신 걸 환영해요. 여기는 나만 보는 채팅방이에요. 떠오르는 걸 바로 보내 두세요.',
    '메모방과 폴더를 마우스로 끌거나 터치로 길게 누른 채 끌어 이동해요. 선택 버튼으로 여러 항목을 체크할 수 있고, 이동 후 되돌리기도 가능해요.',
    '방 안의 메모를 길게 누르면 복사, 수정, 삭제, 댓글 달기를 할 수 있어요. 댓글은 펼치거나 접을 수 있고, 각 댓글의 ⋯ 메뉴로 개별 수정·삭제할 수 있어요.',
    '사진은 왼쪽 아래 + 버튼으로 첨부하거나, 캡처한 이미지를 입력창에 붙여넣으면 돼요.',
    '위쪽 돋보기로 이 방 안을, 목록 화면의 돋보기로 모든 방을 검색할 수 있어요.',
    '오른쪽 위 메뉴에서 이 방을 PDF로 내보낼 수 있고, 목록 화면 메뉴에서 전체 백업을 저장하거나 불러올 수 있어요.',
    '다 읽으셨으면 이 방은 지워도 괜찮아요.',
  ];
  await backend.setRoom({id, name:'메모톡 사용법', createdAt:now, updatedAt:now + lines.length, last:preview({text:lines[lines.length-1]}), pinned:false});
  for (let i = 0; i < lines.length; i++) await backend.setMsg(id, {id:newId() + i, ts:now + i, text:lines[i]});
}
async function boot(){
  renderList();
  if (window.claude && typeof window.claude.use === 'function'){
    try {
      const get = n => window.claude.use(n).catch(() => null);
      const [db, user, as, dl] = await Promise.all([get('db'), get('user'), get('assets'), get('downloads')]);
      assets = as; downloads = dl;
      const uid = user && typeof user.id === 'function' ? await user.id() : null;
      if (db && uid) backend = makeDb(db, uid);
    } catch(e) {}
  }
  if (!backend) backend = makeLocal();
  enableFileMirrorChangeTracking();
  await restoreFileMirrorHandle();
  await peerClient.restore(fileMirror.handle);
  let first = true;
  backend.watchRooms(list => {
    S.folders = list.filter(r=>r.kind==='folder'); S.archives = list.filter(r=>r.kind==='archive'); S.rooms = list.filter(r=>r.kind!=='folder' && r.kind!=='archive'); S.roomsLoaded = true;
    for(const id of chosenRooms)if(!list.some(item=>item.id===id))chosenRooms.delete(id);
    renderList();
    if (S.cur){ if (!curRoom()) closeRoom(); else renderRoomHeader(); }
    if (pendingBootRoomId && S.roomsLoaded){
      const boot=S.rooms.find(item=>item.id===pendingBootRoomId);
      pendingBootRoomId=null;
      if(boot)openRoom(boot.id);
      else{app.classList.remove('list-collapsed');syncListVisibility();}
    }
    if (first){ first = false; seedIfNew().finally(()=>scheduleVaultAutoBackup()).catch(() => {}); maintainVaultTrash().catch(()=>{}); if(fileMirror.pending) scheduleFileMirror(); }
  });
}
autosize(); updateSend();
setInterval(()=>{if(backend?.mode==='local')scheduleVaultAutoBackup();},30*60*1000);
boot();
})();
