const openCommentIds = new Set();
function memoCommentsHtml(m){
  const comments = Array.isArray(m.comments) ? m.comments : [];
  if(!comments.length)return '';
  const opened = openCommentIds.has(m.id) ? ' open' : '';
  const body = comments.map(c=>`<div class="memo-comment" data-comment-item="${esc(c.id)}"><div class="memo-comment-main"><div class="memo-comment-text">${renderText(String(c.text||''),'')}</div><span class="memo-comment-time">${esc(fTime.format(new Date(c.ts||m.ts)))}${c.edited ? ' · 수정됨' : ''}</span></div><button class="memo-comment-actions" type="button" data-comment-menu="${esc(c.id)}" data-memo-id="${esc(m.id)}" aria-label="댓글 수정 또는 삭제 메뉴" aria-haspopup="dialog" title="댓글 메뉴">⋯</button></div>`).join('');
  return `<details class="memo-comments" data-comment-id="${esc(m.id)}"${opened}><summary>댓글 ${comments.length}개 · ${opened ? '접기' : '펼치기'}</summary><div class="memo-comments-body">${body}<button class="memo-comment-add" type="button" data-add-comment="${esc(m.id)}">+ 댓글 쓰기</button></div></details>`;
}
async function addMemoComment(id){
  const memo = S.msgs.find(m=>m.id===id), rid=S.cur;
  if(!memo||!rid)return;
  let completed=false;
  const dialog=openScrim(`<h2>메모에 댓글 달기</h2><p>원래 메모 아래에 댓글이 연결됩니다.</p><textarea class="field memo-comment-field" id="memo-comment-text" maxlength="10000" placeholder="댓글을 입력하세요"></textarea><div class="btns"><button class="ghost" type="button">취소</button><button class="ok" type="button">댓글 저장</button></div>`);
  const field=dialog.querySelector('#memo-comment-text');
  dialog.querySelector('.ghost').addEventListener('click',closeSheet);
  const save=async()=>{
    if(completed)return;
    const text=field.value.trim();if(!text){field.focus();return;}
    completed=true;
    const ok=dialog.querySelector('.ok');ok.disabled=true;dialog.setAttribute('aria-busy','true');
    try{
      if(S.cur!==rid)throw new Error('room_changed');
      const latest=await backend.loadMsgs(rid);
      const target=latest.find(m=>m.id===id);
      if(!target)throw new Error('memo_missing');
      const comments=Array.isArray(target.comments)?target.comments.slice():[];
      comments.push({id:newId(),ts:Date.now(),text});
      await backend.updateMsg(rid,id,{comments});
      openCommentIds.add(id);
      completed=true;dialog.removeAttribute('aria-busy');closeSheet();renderMsgs();
      toast('댓글을 저장했어요.');
      requestAnimationFrame(()=>msgsEl.querySelector(`[data-comment-id="${CSS.escape(id)}"]`)?.scrollIntoView({block:'nearest'}));
    }catch(e){completed=false;ok.disabled=false;dialog.removeAttribute('aria-busy');toast('댓글을 저장하지 못했어요. 다시 시도해 주세요.');field.focus();}
  };
  dialog.querySelector('.ok').addEventListener('click',save);
  field.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();save();}});
  field.focus();
}
// Each comment has its own stable ID; editing or deleting it does not alter sibling comments.
function memoCommentMenu(memoId,commentId){
  const memo=S.msgs.find(m=>m.id===memoId);
  const comment=memo?.comments?.find(c=>c.id===commentId);
  if(!comment)return toast('댓글을 찾지 못했어요.');
  menu('댓글 관리',[
    {icon:'edit',label:'이 댓글 수정',run:()=>editMemoComment(memoId,commentId)},
    {icon:'trash',label:'이 댓글 삭제',danger:true,run:()=>deleteMemoComment(memoId,commentId)}
  ]);
}
function editMemoComment(memoId,commentId){
  const memo=S.msgs.find(m=>m.id===memoId),rid=S.cur;
  const current=memo?.comments?.find(c=>c.id===commentId);
  if(!current||!rid)return toast('댓글을 찾지 못했어요.');
  const original=String(current.text||'');
  const dialog=openScrim(`<h2>댓글 수정</h2><p>이 댓글 하나만 수정합니다. 원본 메모와 다른 댓글은 그대로 둡니다.</p><textarea class="field memo-comment-field" id="memo-comment-edit" maxlength="10000" aria-label="댓글 내용"></textarea><div class="btns"><button class="ghost" type="button">취소</button><button class="ok" type="button">수정 저장</button></div>`);
  const field=dialog.querySelector('#memo-comment-edit');field.value=original;
  dialog.querySelector('.ghost').addEventListener('click',closeSheet);
  let busy=false;
  const save=async()=>{
    if(busy)return;
    const text=field.value.trim();
    if(!text){toast('빈 댓글은 저장할 수 없어요.');field.focus();return;}
    if(text===original){closeSheet();return;}
    busy=true;const ok=dialog.querySelector('.ok');ok.disabled=true;dialog.setAttribute('aria-busy','true');
    try{
      if(S.cur!==rid)throw new Error('room_changed');
      const latest=(await backend.loadMsgs(rid)).find(m=>m.id===memoId);
      if(!latest)throw new Error('memo_missing');
      const comments=Array.isArray(latest.comments)?latest.comments.slice():[];
      const idx=comments.findIndex(c=>c.id===commentId);
      if(idx<0)throw new Error('comment_missing');
      if(String(comments[idx].text||'')!==original)throw new Error('comment_changed');
      comments[idx]={...comments[idx],text,edited:Date.now()};
      await backend.updateMsg(rid,memoId,{comments});
      S.gcache=null;openCommentIds.add(memoId);
      dialog.removeAttribute('aria-busy');closeSheet();renderMsgs();toast('댓글을 수정했어요.');
    }catch(e){
      busy=false;ok.disabled=false;dialog.removeAttribute('aria-busy');
      toast(e.message==='comment_changed'?'댓글이 다른 곳에서 수정되었어요. 내용을 확인한 뒤 다시 시도해 주세요.':e.message==='comment_missing'?'이미 삭제된 댓글이에요.':'댓글을 수정하지 못했어요. 입력 내용은 유지됩니다.');
      field.focus();
    }
  };
  dialog.querySelector('.ok').addEventListener('click',save);
  field.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();save();}});
  field.focus();field.setSelectionRange(field.value.length,field.value.length);
}
async function deleteMemoComment(memoId,commentId){
  const memo=S.msgs.find(m=>m.id===memoId),rid=S.cur;
  if(!rid||!memo?.comments?.some(c=>c.id===commentId))return toast('댓글을 찾지 못했어요.');
  if(!await ask({title:'선택한 댓글 1개를 삭제할까요?',body:'이 댓글만 휴지통에 30일간 보관해요. 원본 메모와 다른 댓글은 그대로 둡니다.',ok:'댓글 삭제',danger:true}))return;
  try{
    if(S.cur!==rid)throw new Error('room_changed');
    const latest=(await backend.loadMsgs(rid)).find(m=>m.id===memoId);
    if(!latest)throw new Error('memo_missing');
    const comments=Array.isArray(latest.comments)?latest.comments.slice():[];
    if(!comments.some(c=>c.id===commentId))throw new Error('comment_missing');
    const removed=comments.find(c=>c.id===commentId);
    const remaining=comments.filter(c=>c.id!==commentId);
    await beforeDeletion();
    const record={id:newId(),kind:'comment',label:String(removed.text||'댓글').slice(0,70),deletedAt:Date.now(),payload:{roomId:rid,memoId,comment:structuredClone(removed)}};
    await vaultPut('trash',record);
    try{await backend.updateMsg(rid,memoId,{comments:remaining});}
    catch(error){await vaultDelete('trash',record.id).catch(()=>{});throw error;}
    S.gcache=null;
    if(remaining.length)openCommentIds.add(memoId);else openCommentIds.delete(memoId);
    renderMsgs();toast('댓글을 휴지통으로 옮겼어요.');
  }catch(e){toast('댓글을 삭제하지 못했어요. 다시 시도해 주세요.');}
}
function renderMsgs(){
  if (!S.cur) return;
  renderRoomHeader();
  const nearBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < tuning.messageEdge;
  const stick = memoLayoutMode === 'chat' && memoSortMode==='old' && (S.forceBottom || (!memoUserReading && nearBottom));
  if (!S.msgsLoaded){ msgsEl.innerHTML = ''; return; }
  if (!S.msgs.length){ msgsEl.innerHTML = `<p class="room-empty">아직 메모가 없어요. 아래에 적어서 나에게 보내 보세요.</p>`; return; }
  const q = S.rs.open ? S.rs.q : '';
  const curHit = S.rs.hits[S.rs.idx];
  let html = '', prevDay = null;
  const displayed=sortedMemoView(S.msgs);
  displayed.forEach((m, i) => {
    const prev = displayed[i-1], next = displayed[i+1];
    const dk = validChrono(m.ts)!==null?dayKey(m.ts):'unknown';
    if (dk !== prevDay){ html += `<div class="day">${esc(dk==='unknown'?'작성 날짜 없음':fDay.format(new Date(m.ts)))}</div>`; prevDay = dk; }
    const first = !prev || (validChrono(prev.ts)!==null?dayKey(prev.ts):'unknown') !== dk || minuteKey(prev.ts) !== minuteKey(m.ts);
    const showTime = !next || (validChrono(next.ts)!==null?dayKey(next.ts):'unknown') !== dk || minuteKey(next.ts) !== minuteKey(m.ts) || (m.edited && !next.edited);
    const imgs = m.images || [];
    const pics = imgs.length ? `<div class="pics n${Math.min(imgs.length, 4)}">${imgs.map((im, k) => `<img loading="lazy" alt="첨부한 사진" data-k="${k}" src="${esc(imgSrc(im))}"${im.w ? ` width="${im.w}" height="${im.h}"` : ''}>`).join('')}</div>` : '';
    const bubble = m.text ? `<div class="bubble${imgs.length ? '' : ' lead'}">${renderText(m.text, q)}</div>` : '';
    const conflictButton = m.conflicts?.length ? `<button class="conflict-link" type="button" data-conflicts="${esc(m.id)}" aria-label="이 메모의 이전 내용과 차이 ${m.conflicts.length}건 보기">이전 내용과 차이 ${m.conflicts.length}건 보기</button>` : '';
    const meta = (memoLayoutMode === 'grid' || showTime) ? `<div class="meta">${m.edited ? '<span>수정됨</span>' : ''}<span>${esc(validChrono(m.ts)!==null?fTime.format(new Date(m.ts)):'날짜 없음')}</span></div>` : (m.edited ? `<div class="meta"><span>수정됨</span></div>` : '');
    html += `<div class="row${first ? ' first gap' : ''}${curHit === m.id ? ' cur' : ''}" data-id="${esc(m.id)}"${memoLayoutMode === 'grid' ? ' tabindex="0" role="button" aria-label="메모 펼쳐 보기"' : ''}>${meta}<div class="content">${pics}${bubble}${conflictButton}${memoCommentsHtml(m)}</div></div>`;
  });
  msgsEl.innerHTML = html;
  if (S.rs.open && curHit) scrollToMsg(curHit, false);
  else if (stick) msgsEl.scrollTop = msgsEl.scrollHeight;
  else if(memoSortMode!=='old'&&S.forceBottom)msgsEl.scrollTop=0;
  S.forceBottom = false;
}

function memoSentenceUnits(text){
  const source=String(text||'');
  const chunks=typeof Intl.Segmenter==='function'
    ? [...new Intl.Segmenter('ko',{granularity:'sentence'}).segment(source)].map(x=>x.segment)
    : source.split(/(?<=[.!?。！？])\s+/u);
  return chunks.flatMap(chunk=>chunk.split(/\r?\n/).map(part=>part.trim()).filter(Boolean));
}
function selectMemoSentences(m){
  if(!m?.text)return;
  const units=memoSentenceUnits(m.text);
  if(!units.length)return toast('선택할 문장이 없어요.');
  const rows=units.map((sentence,index)=>'<div class="memo-sentence-row"><label><input type="checkbox" data-sentence="'+index+'"><span>'+esc(sentence)+'</span></label><button type="button" data-copy-unit="'+index+'" aria-label="'+(index+1)+'번째 문장 복사">이 문장 복사</button></div>').join('');
  const sheet=openScrim('<h2>문장 선택 · 복사</h2><p>각 문장 옆 복사 버튼을 누르거나 여러 문장을 선택하세요.</p>'+
    '<div class="memo-sentence-toolbar"><button type="button" data-select-all>전체 선택</button><button type="button" data-select-none>해제</button><button type="button" class="primary" data-copy-selected>선택 문장 복사</button></div>'+
    rows+'<div class="btns"><button type="button" class="ghost" data-close-sentence>닫기</button></div>');
  const checks=[...sheet.querySelectorAll('input[data-sentence]')];
  sheet.querySelector('[data-select-all]').onclick=()=>checks.forEach(x=>{x.checked=true;});
  sheet.querySelector('[data-select-none]').onclick=()=>checks.forEach(x=>{x.checked=false;});
  sheet.querySelector('[data-copy-selected]').onclick=()=>{
    const selected=checks.filter(x=>x.checked).map(x=>units[Number(x.dataset.sentence)]);
    if(!selected.length)return toast('복사할 문장을 선택해 주세요.');
    closeSheet();
    copyText(selected.join('\n'));
  };
  sheet.querySelectorAll('[data-copy-unit]').forEach(button=>button.onclick=()=>{
    const selected=units[Number(button.dataset.copyUnit)];
    closeSheet();
    copyText(selected);
  });
  sheet.querySelector('[data-close-sentence]').onclick=closeSheet;
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); toast('복사했어요.'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_) {}
    ta.remove(); toast(ok ? '복사했어요.' : '복사가 막혀 있어요. 메시지를 수정 화면에서 열어 직접 복사해 주세요.');
  }
}
async function deleteMsg(m){
  if (!await ask({title:'이 메모를 삭제할까요?', body:'휴지통에 30일간 보관하며, 그동안 복구할 수 있어요.', ok:'삭제', danger:true})) return;
  const rid = S.cur;
  const wasLast = S.msgs[S.msgs.length-1]?.id === m.id;
  try {
    await beforeDeletion();
    const record={id:newId(),kind:'memo',label:preview(m)||'사진 메모',deletedAt:Date.now(),payload:{roomId:rid,roomName:curRoom()?.name||'',memo:(await portableMessages([m]))[0]}};
    await vaultPut('trash',record);
    try{await backend.deleteMsg(rid,m.id);}
    catch(error){await vaultDelete('trash',record.id).catch(()=>{});throw error;}
    if (S.editing?.id === m.id) cancelEdit();
    if (wasLast){
      const rest = S.msgs.filter(x => x.id !== m.id); const nl = rest[rest.length-1];
      backend.updateRoom(rid, {last: nl ? preview(nl) : ''}).catch(() => {});
    }
  } catch(e){ toast('삭제하지 못했어요. 다시 시도해 주세요.'); }
}

/* ---------- in-room search ---------- */
$('#btn-rsearch').addEventListener('click', () => S.rs.open ? closeRoomSearch() : openRoomSearch(''));
$('#rs-close').addEventListener('click', () => closeRoomSearch());
function openRoomSearch(q){
  S.rs.open = true; $('#rsearch').hidden = false;
  const f = $('#rsearch-input'); f.value = q; S.rs.q = q;
  computeHits(true); renderMsgs();
  if (!q) f.focus();
}
function closeRoomSearch(silent){
  S.rs = {open:false, q:'', hits:[], idx:-1};
  $('#rsearch').hidden = true; $('#rsearch-input').value = ''; $('#rsearch-count').textContent = '';
  if (!silent) renderMsgs();
}
function computeHits(resetIdx){
  const ql = S.rs.q.toLowerCase();
  const prevId = S.rs.hits[S.rs.idx];
  S.rs.hits = ql ? S.msgs.filter(m => (m.text || '').toLowerCase().includes(ql)).map(m => m.id) : [];
  const keep = S.rs.hits.indexOf(prevId);
  S.rs.idx = !resetIdx && keep >= 0 ? keep : S.rs.hits.length - 1;
  updateRsCount();
}
function updateRsCount(){
  const n = S.rs.hits.length;
  $('#rsearch-count').textContent = S.rs.q ? (n ? `${S.rs.idx + 1}/${n}` : '0') : '';
}
let rTimer = null;
$('#rsearch-input').addEventListener('input', e => { clearTimeout(rTimer); rTimer = setTimeout(() => { S.rs.q = e.target.value.trim(); computeHits(true); renderMsgs(); }, tuning.roomSearch); });
$('#rsearch-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); stepHit(e.shiftKey ? 1 : -1); } });
function stepHit(d){
  const n = S.rs.hits.length; if (!n) return;
  S.rs.idx = (S.rs.idx + d + n) % n; updateRsCount(); renderMsgs();
}
$('#rs-up').addEventListener('click', () => stepHit(-1));
$('#rs-down').addEventListener('click', () => stepHit(1));

// Android already accounts for both IME + navigation bar in the NATIVE
// WebView's available area. Do not set an extra visualViewport pixel height:
// that double-resizes the page and can create a white strip / occluded input.
const memoIsAndroidApp = !!window.AndroidMemoTalk;
if (memoIsAndroidApp) document.documentElement.classList.add('native-android');
let memoKeyboardFrame = 0;
let memoUserReading = false;
function layoutForVisibleKeyboard(){

async function send(){
  if (S.sending || !S.cur) return;
  const rid = S.cur;
  // Snapshot the exact input. The outgoing text is normalized, but the visible
  // composer may still contain spaces or a trailing newline.
  const originalInput = input.value;
  const revisionAtSend = composerRevision;
  const text = originalInput.replace(/^\s*\n|\s+$/g, '');
  if (S.editing){
    const ed = S.editing;
    if (!text.trim()) return toast('내용이 비어 있어요. 지우려면 메모를 길게 눌러 삭제해 주세요.');
    if (text === ed.text){ cancelEdit(); return; }
    S.sending = true; updateSend();
    try {
      await backend.updateMsg(rid, ed.id, {text, edited:Date.now()});
      const isLast = S.msgs[S.msgs.length-1]?.id === ed.id;
      if (isLast) backend.updateRoom(rid, {last:preview({text})}).catch(() => {});
      cancelEdit(); S.gcache = null;
    } catch(e){ toast('수정하지 못했어요. 다시 시도해 주세요.'); }
    finally { S.sending = false; updateSend(); }
    return;
  }
  if (!text.trim() && !S.pending.length) return;
  S.sending = true; updateSend();
  const pend = S.pending.slice();
  try {
    const images = [];
    for (const p of pend) images.push(await storeImage(p, pend.length));
    const ts = Date.now();
    const msg = {id:newId(), ts, text: text.trim() ? text : ''};
    if (images.length) msg.images = images;
    S.forceBottom = true; memoUserReading = false;
    await backend.setMsg(rid, msg);
    // Only clear the text submitted by this send. It must have been saved,
    // and the user must not have typed again while that save was pending.
    if (S.cur === rid && !S.editing &&
        composerRevision === revisionAtSend && input.value === originalInput) {
      input.value = '';
      autosize();
    }
    if (S.drafts[rid] === originalInput || !S.drafts[rid]) S.drafts[rid] = '';
    persistHostedDrafts();
    // Remove only attachments that actually went out; keep newer attachments.
    S.pending = S.pending.filter(p => !pend.includes(p));
    pend.forEach(p => URL.revokeObjectURL(p.url));
    renderPending();
    S.gcache = null;
    backend.updateRoom(rid, {last:preview(msg), updatedAt:ts}).catch(() => {});
  } catch(e){
    autosize();
    toast(e && e.message === 'quota' ? '이 기기의 저장 공간이 가득 찼어요. 사진이 많은 메모를 지우거나 백업한 뒤 정리해 주세요.' : '보내지 못했어요. 연결을 확인하고 다시 보내 주세요.');
  } finally { S.sending = false; updateSend(); }
}

}

async function runFileMirror(interactive=false){
  if(peerClient?.active){if(interactive)await peerClient.run();return;}
  clearTimeout(fileMirror.timer);
  if(window.AndroidMemoTalk){
    const message='Android 폴더 자동 공유는 Windows ↔ Android 양방향 공유로 연결하세요. 기존 파일과 내부 메모는 유지됩니다.';
    fileMirrorStatus('pending',message);if(interactive)toast(message,true);return;
  }
  const root=fileMirror.handle;
  if(!root){if(interactive)await linkFileMirror();return;}
  if(fileMirror.busy){fileMirror.dirty=true;return;}
  if(!S.roomsLoaded){fileMirror.pending=true;return;}
  fileMirror.busy=true;
  fileMirrorStatus('pending',`${root.name} · Markdown 파일 준비 중…`);
  try{
    if(!await ensureMirrorPermission(root,interactive))throw new Error('mirror_permission');
    await window.MemoTalkFS?.beginMirror?.(root);
    const {entries}=await buildTransferEntries();
    const result=await MemoTalkMirror.save({root,linkId:fileMirror.linkId,
      entries:entries.map(([path,value])=>[path,bytes(value)]),read:readMirrorFile,write:writeMirrorFile,digest:mirrorDigest,legacyDigest:mirrorLegacyDigest,
      transactionId:crypto.randomUUID?.()||newId()});
    fileMirror.pending=false;
    try{localStorage.removeItem('memotalk.fileMirror.pending');}catch(_){}
    fileMirrorStatus('saved',`${root.name} · 로컬 ${result.count}개 파일 읽기 검증 완료 · 원격 Sync 미확인${result.retained?` · 이전 경로 ${result.retained}개 유지`:''}`);
    if(interactive)toast(`로컬 파일 ${result.count}개 저장·검증 완료. Obsidian Sync 전송 상태는 Obsidian에서 확인하세요.`);
  }catch(error){
    fileMirror.pending=true;
    try{localStorage.setItem('memotalk.fileMirror.pending','1');}catch(_){}
    const d=mirrorFailure(error);
    const message=`파일 저장 중단 · ${d.code} · ${d.operation} · ${d.relativePath||'(준비 단계)'} · 내부 메모 유지 · 파일 저장 메뉴에서 진단 확인`;
    fileMirrorStatus('error',message);
    if(interactive)toast(message,true);
  }finally{
    try{await window.MemoTalkFS?.endMirror?.(root);}catch(error){mirrorFailure(error);}
    fileMirror.busy=false;
    $('#btn-file-folder').disabled=false;
    if(fileMirror.dirty){fileMirror.dirty=false;scheduleFileMirror();}
  }
}

const utf8 = new TextEncoder(), utf8Read = new TextDecoder('utf-8', {fatal:true});
const bytes = value => value instanceof Uint8Array ? value : utf8.encode(value);

function zipPack(entries){

    u32(h,16,item.crc); u32(h,20,item.size); u32(h,24,item.size); u16(h,28,item.name.length); u32(h,42,item.offset);

async function zipOpen(file){

const transferName = value => safeName(String(value||'메모')).replace(/\s+/g,'-');
const transferId = value => String(value||'').replace(/[^\w-]/g,'');
const transferIso = value => Number.isFinite(new Date(value).getTime()) ? new Date(value).toISOString() : new Date().toISOString();
function transferRoomPath(room, folders){
  const seen=new Set(), parts=[]; let current=room.folderId;
  while(current && !seen.has(current)){
    seen.add(current); const folder=folders.find(f=>f.id===current); if(!folder)break;
    parts.unshift(`${transferName(folder.name)}--${transferId(folder.id)}`); current=folder.parentId;
  }
  return `${parts.length ? parts.join('/')+'/' : ''}${transferName(room.name)}--${transferId(room.id)}`;
}
function transferFolderPath(folder,folders){
  const parts=[],seen=new Set();let current=folder;
  while(current&&!seen.has(current.id)){
    seen.add(current.id);
    parts.unshift(`${transferName(current.name)}--${transferId(current.id)}`);
    current=folders.find(f=>f.id===current.parentId);
  }
  return parts.join('/');
}
function makeMemoMarkdown(m, roomId, imagePaths, refs=[]){
  const meta=`---\nmemotalk_id: ${JSON.stringify(m.id)}\nroom_id: ${JSON.stringify(roomId)}\ncreated_at: ${JSON.stringify(transferIso(m.ts))}\n${m.edited ? `edited_at: ${JSON.stringify(transferIso(m.edited))}\n` : ''}---\n`;
  const links=refs.length ? `<!-- memotalk-links:start -->\n> 이전 내용: ${refs.flatMap((ref,i)=>(ref.parts?.length?ref.parts:[null]).map(n=>`[${n?`차이 (${n})`:`기록 ${i+1}`}](../conflicts/${ref.id}-review.md${n?`#차이-${n}`:''})`)).join(' · ')}\n<!-- memotalk-links:end -->\n\n` : '';
  const comments=Array.isArray(m.comments)&&m.comments.length ? `\n\n<!-- memotalk-comments:start -->\n## 댓글 (${m.comments.length})\n\n${m.comments.map(c=>`> ${String(c.text||'').replace(/\n/g,'\n> ')}\n> — ${transferIso(c.ts||m.ts)}${c.edited?` (수정: ${transferIso(c.edited)})`:''}`).join('\n\n')}\n<!-- memotalk-comments:end -->` : '';
  const attachments=imagePaths.length ? `\n\n<!-- memotalk-attachments:start -->\n${imagePaths.map(path=>`![](../${encodeURI(path)})`).join('\n')}\n<!-- memotalk-attachments:end -->` : '';
  return `${meta}\n${links}${m.text||''}${comments}${attachments}\n`;
}
function readMemoMarkdown(markdown, expectedId){
  const match=/^---\r?\n([\s\S]*?)\r?\n---\r?\n/.exec(markdown);
  if(!match || !match[1].split(/\r?\n/).some(line=>line===`memotalk_id: ${JSON.stringify(expectedId)}`))throw new Error('transfer_format');
  return markdown.slice(match[0].length).replace(/^\r?\n/,'')
    .replace(/^<!-- memotalk-links:start -->[\s\S]*?<!-- memotalk-links:end -->\r?\n\r?\n/,'')
    .replace(/\r?\n\r?\n<!-- memotalk-attachments:start -->[\s\S]*?<!-- memotalk-attachments:end -->\r?\n?$/,'')
    .replace(/\r?\n\r?\n<!-- memotalk-comments:start -->[\s\S]*?<!-- memotalk-comments:end -->/,'')
    .replace(/\r?\n$/,'');
}
const archiveRoomId = id => `memotalk-archive-${id}`;
function compareMemoText(oldText,newText){
  const old=String(oldText||'').split('\n'), fresh=String(newText||'').split('\n');
  if(oldText===newText)return [{kind:'same',text:oldText||''}];
  if(old.length>DIFF_MAX_LINES || fresh.length>DIFF_MAX_LINES)return [{kind:'change',old:oldText||'',fresh:newText||'',index:1}];
  const dp=Array.from({length:old.length+1},()=>new Uint16Array(fresh.length+1));
  for(let i=old.length-1;i>=0;i--)for(let j=fresh.length-1;j>=0;j--)dp[i][j]=old[i]===fresh[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const parts=[];let i=0,j=0;
  while(i<old.length||j<fresh.length){
    if(i<old.length&&j<fresh.length&&old[i]===fresh[j]){parts.push({kind:'same',text:old[i++]});j++;}
    else if(j<fresh.length&&(i===old.length||dp[i][j+1]>=dp[i+1][j]))parts.push({kind:'add',text:fresh[j++]});
    else parts.push({kind:'remove',text:old[i++]});
  }
  const groups=[];
  for(const part of parts){
    let group=groups[groups.length-1];
    const kind=part.kind==='same'?'same':'change';
    if(!group||group.kind!==kind)groups.push(group={kind,old:[],fresh:[],text:[]});
    group[part.kind==='same'?'text':part.kind==='add'?'fresh':'old'].push(part.text);
  }
  let number=0;
  return groups.map(group=>group.kind==='same'?{kind:'same',text:group.text.join('\n')}:{kind:'change',old:group.old.join('\n'),fresh:group.fresh.join('\n'),index:++number});
}
function reviewMarkdown(archive){

  const body=parts.map(part=>part.kind==='same'?part.text:`\n## 차이-${part.index}\n\n기존 내용 (${part.index}):\n\n${color(part.old,'🔴','(없음)')}\n\n새 내용 (${part.index}):\n\n${color(part.fresh,'🔵','(삭제됨)')}\n`).join('\n');
  const imageNote=archive.imageChanged?`\n\n## 차이-사진\n\n==🔴기존 사진 ${archive.images?.length||0}장==\n\n==🔵새 사진 ${archive.incomingImageCount||0}장==\n\n사진 파일도 서로 다릅니다.`:'';

function transferPath(files,prefix,relative){

async function decodeTransferImage(files,prefix,item){

}
async function sameImages(a,b){

  for(let i=0;i<(a||[]).length;i++)if(await imageDataUrl(a[i])!==b[i].data)return false;
  return true;
}
async function adaptTransferImages(images,uploadedAssets){
  if(backend.mode!=='db')return images;
  const out=[];
  for(const im of images){
    if(assets){try{const uploaded=await assets.upload(dataUrlToBlob(im.data));uploadedAssets.add(uploaded.id);out.push({asset:uploaded.id,w:im.w,h:im.h});continue;}catch(_){}}

/* On-screen update choice for installed standalone Android/Windows apps.
   The OS installer is launched only by an explicit user click; no silent upgrades. */
const APP_RELEASE_API='https://api.github.com/repos/hoistes00-ctrl/memotalk/releases?per_page=25';
const installedAppVersion=(document.title.match(/(\d+\.\d+\.\d+)/)||[])[1]||'0.0.0';
function releaseVersion(value){
  if(typeof value!=='string'||!/^\d+\.\d+\.\d+$/.test(value))return null;
  return value.split('.').map(Number);
}
function isNewerRelease(a,b){
  const left=releaseVersion(a),right=releaseVersion(b);
  return !!left&&!!right&&(left[0]>right[0]||(left[0]===right[0]&&(left[1]>right[1]||
    (left[1]===right[1]&&left[2]>right[2]))));
}
function selectAppRelease(releases,current,platform){
  if(!Array.isArray(releases))return null;
  const matches=[];
  for(const release of releases){
    if(release?.draft||release?.prerelease)continue;
    const m=/^modutalk-v(\d+\.\d+\.\d+)$/.exec(release.tag_name||'');
    if(!m||!isNewerRelease(m[1],current))continue;
    const name=platform==='android'?'Modutalk-Android-'+m[1]+'.apk':'Modutalk-Setup-'+m[1]+'-x64.exe';
    const asset=(release.assets||[]).find(a=>a.name===name&&Number(a.size)>0&&
      typeof a.browser_download_url==='string'&&a.browser_download_url.startsWith(
      'https://github.com/hoistes00-ctrl/memotalk/releases/download/'+release.tag_name+'/'));
    if(asset)matches.push({version:m[1],tag:release.tag_name,url:asset.browser_download_url});
  }
  matches.sort((a,b)=>isNewerRelease(a.version,b.version)?-1:isNewerRelease(b.version,a.version)?1:0);
  return matches[0]||null;
}
async function checkAppUpdates({manual=false}={}){
  if(window.MemoTalkHostCapabilities){
    if(manual)toast('Obsidian 연동 화면 상단의 업데이트 버튼을 눌러 주세요.');
    return;
  }
  let last=0;try{last=Number(localStorage.getItem('memotalk.update.checkedAt')||0)||0;}catch(_){}
  if(!manual&&Date.now()-last<24*60*60*1000)return;
  try{
    const ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),8000);
    let response;
    try{response=await fetch(APP_RELEASE_API,{headers:{Accept:'application/vnd.github+json'},signal:ctrl.signal});}
    finally{clearTimeout(timeout);}
    if(!response.ok)throw Error('offline');
    const releases=await response.json();
    const platform=window.AndroidMemoTalk?'android':'windows';
    const latest=selectAppRelease(releases,installedAppVersion,platform);
    try{localStorage.setItem('memotalk.update.checkedAt',String(Date.now()));}catch(_){}
    if(!latest){if(manual)toast('모두톡 '+installedAppVersion+'은 현재 최신 정식 앱 버전입니다.');return;}
    if(!manual){
      try{if(localStorage.getItem('memotalk.update.dismissed')===latest.tag)return;}catch(_){}
      if(sheetOpen||viewerEl)return;
    }
    const sheet=openScrim('<h2>모두톡 '+esc(latest.version)+' 업그레이드</h2>'+
      '<p>현재 버전 '+esc(installedAppVersion)+' → 새 버전 '+esc(latest.version)+
      '. 기존 메모나 동기화 그룹은 삭제하지 않습니다. 다운로드한 공식 설치 파일은 운영체제에서 사용자 확인 후 설치합니다.</p>'+
      '<div class="btns"><button type="button" class="ghost" id="modutalk-upgrade-later">나중에</button>'+
      '<a class="ok" id="modutalk-upgrade-download" href="'+esc(latest.url)+'" target="_blank" rel="noopener">업그레이드</a></div>');
    sheet.querySelector('#modutalk-upgrade-later').addEventListener('click',()=>{
      try{localStorage.setItem('memotalk.update.dismissed',latest.tag);}catch(_){}closeSheet();
    });
    const installerLink=sheet.querySelector('#modutalk-upgrade-download');
    // Android WebView opens main-frame links through ACTION_VIEW; popups are disabled.
    // Electron routes target=_blank links to the system browser.
    if(platform==='android')installerLink.target='_self';
    installerLink.addEventListener('click',()=>setTimeout(closeSheet,0));
  }catch(_){if(manual)toast('업데이트를 확인하지 못했어요. 인터넷 연결을 확인해 주세요.');}
}

// Outside Claude (the file opened directly in a browser) a plain download link works.
const standalone = !window.claude;
async function needDownloads(){
  if (downloads || standalone) return true;
  toast('이 화면에서는 파일 저장을 할 수 없어요. claude.ai에서 열어 주세요.');
  return false;
}
async function saveFile(filename, data){
  if(window.MemoTalkFS){
    try {
      const blob = data instanceof Blob ? data : new Blob([data], {type:'application/octet-stream'});
      await window.MemoTalkFS.download(filename, blob);
      toast('파일을 저장했어요.');
    } catch(error) { if(error?.message!=='cancelled')toast('저장할 파일 위치를 선택하지 못했어요.'); }
    return;
  }
  if (!downloads && standalone){
    const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith('.json') ? 'application/json' : filename.endsWith('.zip') ? 'application/zip' : 'text/html'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return toast('저장했어요.');
  }
  try { await downloads.save({filename, data}); toast('저장했어요.'); }
  catch(e){
    if (e?.code === 'declined') return hideToast();
    toast(e?.code === 'too_large' ? '파일이 너무 커서 저장하지 못했어요.' : '파일을 저장하지 못했어요.');
  }
}
const stamp = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const safeName = s => s.replace(/[\\/:*?"<>|\n\r\t]+/g, ' ').trim().slice(0, 60) || '채팅방';

async function imageDataUrl(im){
  if (!im.asset) return im.data || '';
  const res = await fetch('/_blob/' + im.asset);
  if (!res.ok) throw new Error('img');
  return blobToDataUrl(await res.blob());
}

async function exportHtml(ids){
  if (!await needDownloads()) return;
  const rooms = ids.map(id => S.rooms.find(r => r.id === id)).filter(Boolean);
  if (!rooms.length) return toast('저장할 채팅방이 없어요.');
  toast('HTML 만드는 중…', true);
  try {
    const sections = []; let k = 0, missing = 0;
    for (const room of rooms){
      if (rooms.length > 1) toast(`HTML 만드는 중… ${++k}/${rooms.length}`, true);
      const list = await backend.loadAllMsgs(room.id);
      let body = '', prevDay = null;
      for (const m of list){
        const dk = dayKey(m.ts);
        if (dk !== prevDay){ body += `<div class="day">${esc(fDay.format(new Date(m.ts)))}</div>`; prevDay = dk; }
        let pics = '';
        for (const im of m.images || []){
          let src = '';
          try { src = await imageDataUrl(im); } catch(_){ missing++; }
          if (src) pics += `<img src="${esc(src)}" alt="사진"${im.w ? ` width="${im.w}" height="${im.h}"` : ''}>`;
        }
        body += `<div class="row"><div class="meta">${m.edited ? '수정됨<br>' : ''}${esc(fTime.format(new Date(m.ts)))}</div><div class="content">${pics ? `<div class="pics">${pics}</div>` : ''}${m.text ? `<div class="bubble">${renderText(m.text, '')}</div>` : ''}</div></div>`;
      }
      sections.push({room, n:list.length, body});
    }
    const title = rooms.length === 1 ? rooms[0].name : '모두톡 전체 채팅방';
    await saveFile(`${safeName(title)}-${stamp()}.html`, buildExportHtml(title, sections));
    if (missing) toast(`저장했어요. 사진 ${missing}장은 불러오지 못해 빠졌어요.`);
  } catch(e){ toast('HTML을 만들지 못했어요.'); }
}

async function exportBackup(){
  if (!await needDownloads()) return;
  if (!S.rooms.length) return toast('저장할 채팅방이 없어요.');
  toast('백업 만드는 중…', true);
  try {
    const out = {app:'memotalk', version:3, exportedAt:Date.now(), folders:S.folders.map(f=>({id:f.id,name:f.name,parentId:f.parentId||null})), rooms:[], archives:[]};
    let i = 0;
    for (const r of sortedRooms()){
      toast(`백업 만드는 중… ${++i}/${S.rooms.length}`, true);
      const list = await backend.loadAllMsgs(r.id);
      const msgs = [];
      for (const m of list){
        const mm = {id:m.id, ts:m.ts, text:m.text || ''};
        if (m.edited) mm.edited = m.edited;
        if (Array.isArray(m.comments) && m.comments.length) mm.comments = m.comments.map(c=>({id:c.id,ts:c.ts,text:String(c.text||''),...(c.edited?{edited:c.edited}:{})}));
        if (m.conflicts?.length) mm.conflicts = m.conflicts;
        if (m.images?.length){
          mm.images = [];
          for (const im of m.images){
            try {
              const data = await imageDataUrl(im);
              if (!data) throw new Error('backup_image_missing');
              mm.images.push({data, w:im.w, h:im.h});
            } catch(e){ throw new Error('backup_image_missing'); }
          }
        }
        msgs.push(mm);
      }
      out.rooms.push({id:r.id,name:r.name, tags:roomTags(r), folderId:r.folderId||null, createdAt:r.createdAt, updatedAt:r.updatedAt, pinned:!!r.pinned, msgs});
      const archived=await backend.loadAllMsgs(archiveRoomId(r.id));
      if(archived.length){
        const copies=[];
        for(const a of archived){
          const copy={id:a.id,sourceMemoId:a.sourceMemoId,sourceTs:a.sourceTs,archivedAt:a.archivedAt,text:a.text||'',incomingText:a.incomingText||'',incomingImageCount:a.incomingImageCount||0,imageChanged:!!a.imageChanged,comments:a.comments||[],images:[]};
          for(const im of a.images||[]){
            const data=await imageDataUrl(im);if(!data)throw new Error('backup_image_missing');
            copy.images.push({data,w:im.w,h:im.h});
          }
          copies.push(copy);
        }
        out.archives.push({roomId:r.id,msgs:copies});
      }
    }
    await saveFile(`모두톡-백업-${stamp()}.json`, JSON.stringify(out));
  } catch(e){ toast(e?.message === 'backup_image_missing' ? '사진을 읽지 못해 백업을 중단했어요. 누락된 백업은 저장하지 않았어요.' : '백업을 만들지 못했어요.'); }
}
async function importJsonV3(data){
  const folderMap=new Map(),roomMap=new Map(),memoMap=new Map(),archiveMap=new Map(),uploadedAssets=new Set(),ops=[];
  try{
    for(const f of data.folders||[])if(f&&typeof f.id==='string')folderMap.set(f.id,newId());
    for(const r of data.rooms){
      if(!r||typeof r.id!=='string'||!Array.isArray(r.msgs))throw new Error('backup_format');
      roomMap.set(r.id,newId());
      for(const m of r.msgs)if(m&&typeof m.id==='string')memoMap.set(m.id,newId());
    }
    for(const group of data.archives||[])for(const a of group.msgs||[])if(a&&typeof a.id==='string')archiveMap.set(a.id,newId());
    for(const f of data.folders||[])if(folderMap.has(f.id))ops.push({type:'room',expected:null,value:{id:folderMap.get(f.id),kind:'folder',name:String(f.name||'폴더').slice(0,40),parentId:folderMap.get(f.parentId)||null,createdAt:Date.now()}});
    for(const r of data.rooms){
      const id=roomMap.get(r.id), sorted=r.msgs.slice().sort((a,b)=>a.ts-b.ts),last=sorted[sorted.length-1];
      ops.push({type:'room',expected:null,value:{id,name:String(r.name||'메모방').slice(0,40),folderId:folderMap.get(r.folderId)||null,tags:normTags(Array.isArray(r.tags)?r.tags:[]),createdAt:r.createdAt||Date.now(),updatedAt:r.updatedAt||last?.ts||Date.now(),pinned:!!r.pinned,last:last?preview(last):''}});
      for(const m of sorted){
        if(!memoMap.has(m.id))throw new Error('backup_format');
        if((m.conflicts||[]).some(ref=>!archiveMap.has(ref.id)))throw new Error('backup_format');
        const images=[];for(const im of m.images||[]){if(typeof im.data!=='string'||!im.data.startsWith('data:image/'))throw new Error('backup_format');images.push({data:im.data,w:im.w,h:im.h});}
        const refs=mergeConflictRefs((m.conflicts||[]).filter(ref=>archiveMap.has(ref.id)).map(ref=>({id:archiveMap.get(ref.id),createdAt:ref.createdAt})));
        const msg={id:memoMap.get(m.id),ts:Number(m.ts)||Date.now(),text:String(m.text||''),images:await adaptTransferImages(images,uploadedAssets)};
        if(m.edited)msg.edited=m.edited;if(Array.isArray(m.comments))msg.comments=m.comments.filter(c=>c&&typeof c.text==='string').map(c=>({id:newId(),ts:Number(c.ts)||Date.now(),text:c.text,...(c.edited?{edited:Number(c.edited)}:{})}));if(refs.length)msg.conflicts=refs;if(!msg.images.length)delete msg.images;
        ops.push({type:'msg',rid:id,expected:null,value:msg});
      }
    }
    for(const group of data.archives||[]){
      const roomId=roomMap.get(group.roomId);if(!roomId)throw new Error('backup_format');
      const rid=archiveRoomId(roomId);
      ops.push({type:'room',expected:null,value:{id:rid,kind:'archive',name:'충돌 보관함',createdAt:Date.now()}});
      for(const a of group.msgs||[]){
        if(!memoMap.has(a.sourceMemoId)||!archiveMap.has(a.id))throw new Error('backup_format');
        const images=[];for(const im of a.images||[]){if(typeof im.data!=='string'||!im.data.startsWith('data:image/'))throw new Error('backup_format');images.push({data:im.data,w:im.w,h:im.h});}
        ops.push({type:'msg',rid,expected:null,value:{id:archiveMap.get(a.id),ts:Number(a.archivedAt)||Date.now(),archivedAt:Number(a.archivedAt)||Date.now(),sourceMemoId:memoMap.get(a.sourceMemoId),sourceTs:Number(a.sourceTs)||Date.now(),text:String(a.text||''),incomingText:String(a.incomingText||''),incomingImageCount:Number(a.incomingImageCount)||0,imageChanged:!!a.imageChanged,comments:Array.isArray(a.comments)?a.comments:[],images:await adaptTransferImages(images,uploadedAssets)}});
      }
    }
    await backend.applyTransfer(ops);S.gcache=null;toast('백업을 불러왔어요. 이전 내용 기록도 복원했어요.');
  }catch(error){
    for(const id of uploadedAssets)try{await assets?.delete(id);}catch(_){}
    toast(error?.message==='quota'?'저장 공간이 부족해 백업을 불러오지 못했어요.':'백업을 불러오지 못했어요. 기존 메모는 유지됩니다.');
  }
}

$('#file-backup').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch(_){ return toast('백업 파일을 읽지 못했어요. 모두톡에서 저장한 .json 파일인지 확인해 주세요.'); }
  if (data?.app !== 'memotalk' || !Array.isArray(data.rooms)) return toast('모두톡 백업 파일이 아니에요.');
  const nMsgs = data.rooms.reduce((a, r) => a + (r.msgs?.length || 0), 0);
  if (!await ask({title:'백업을 불러올까요?', body:`채팅방 ${data.rooms.length}개, 메모 ${nMsgs}개를 새로 추가해요. 지금 있는 채팅방은 그대로 남아요.`, ok:'불러오기'})) return;
  if(data.version===3)return importJsonV3(data);
  const names = new Set(S.rooms.map(r => r.name));
  const folderMap=new Map();
  // Preserve directory relationships when importing v2; v1 backups simply remain unfiled.
  const importedFolders=Array.isArray(data.folders)?data.folders:[];
  try{
    for(const f of importedFolders){if(!f || typeof f.id!=='string')continue;folderMap.set(f.id,newId());}
    for(const f of importedFolders){if(!folderMap.has(f.id))continue;
      await backend.setRoom({id:folderMap.get(f.id),kind:'folder',name:String(f.name||'폴더').slice(0,40),parentId:folderMap.get(f.parentId)||null,createdAt:Date.now()});}
  }catch(_){return toast('폴더 복원 중 오류가 발생했어요. 일부 폴더가 만들어졌을 수 있어요.');} 
  let done = 0;
  try {
    for (const r of data.rooms){
      const id = newId();
      const name = names.has(r.name) ? `${r.name} (불러옴)` : String(r.name || '채팅방');
      const msgs = (r.msgs || []).slice().sort((a, b) => a.ts - b.ts);
      const lastM = msgs[msgs.length-1];
      await backend.setRoom({id, name, folderId:folderMap.get(r.folderId)||null, tags:normTags(Array.isArray(r.tags) ? r.tags : []), createdAt:r.createdAt || Date.now(), updatedAt:r.updatedAt || lastM?.ts || Date.now(), pinned:!!r.pinned, last: lastM ? preview(lastM) : ''});
      for (const m of msgs){
        toast(`불러오는 중… ${++done}/${nMsgs}`, true);
        const msg = {id:newId(), ts:+m.ts || Date.now(), text:String(m.text || '')};
        if (m.edited) msg.edited = m.edited;
        if (Array.isArray(m.comments)) msg.comments = m.comments.filter(c=>c&&typeof c.text==='string').map(c=>({id:newId(),ts:Number(c.ts)||Date.now(),text:c.text,...(c.edited?{edited:Number(c.edited)}:{})}));
        if (m.images?.length){
          msg.images = [];
          for (const im of m.images){
            if (typeof im.data !== 'string' || !im.data.startsWith('data:image/')) continue;
            if (assets){
              try { const up = await assets.upload(dataUrlToBlob(im.data)); msg.images.push({asset:up.id, w:im.w, h:im.h}); continue; } catch(_){}
            }
            if (backend.mode === 'db') msg.images.push(im.data.length <= 220000 / m.images.length ? {data:im.data, w:im.w, h:im.h} : await inlineFit(im.data, Math.floor(220000 / m.images.length)));
            else msg.images.push({data:im.data, w:im.w, h:im.h});
          }
          if (!msg.images.length) delete msg.images;
        }
        await backend.setMsg(id, msg);
      }
    }
    S.gcache = null;
    toast('백업을 불러왔어요.');
  } catch(err){
    toast(err?.message === 'quota' ? '이 기기 저장 공간이 가득 차서 일부만 불러왔어요.' : '불러오다 멈췄어요. 일부만 추가됐을 수 있어요.');
  }
});

/* ---------- PDF export (drawn on canvas, packed with jsPDF) ---------- */
function loadScript(src){
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`) && window.jspdf) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s);
  });
}
function wrapText(ctx, text, maxW){
  const out = [];
  for (const para of String(text).split('\n')){
    if (para === ''){ out.push(''); continue; }
    const toks = para.match(/\S+|\s+/g) || [''];
    let line = '';
    for (const tok of toks){
      if (ctx.measureText(line + tok).width <= maxW){ line += tok; continue; }
      if (/^\s+$/.test(tok)){ out.push(line); line = ''; continue; }
      if (line.trim()){ out.push(line.replace(/\s+$/, '')); line = ''; }
      if (ctx.measureText(tok).width <= maxW){ line = tok; continue; }
      let chunk = '';
      for (const ch of Array.from(tok)){
        if (chunk && ctx.measureText(chunk + ch).width > maxW){ out.push(chunk); chunk = ch; } else chunk += ch;
      }
      line = chunk;
    }
    out.push(line.replace(/\s+$/, ''));
  }
  return out;
}
function rr(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath(); ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
async function exportPdf(rid){
  const room = S.rooms.find(r => r.id === rid); if (!room) return;
  if (!await needDownloads()) return;
  toast('PDF 만드는 중…', true);
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const msgs = await backend.loadAllMsgs(rid);
    const FAM = '"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
    const allText = room.name + msgs.map(m => m.text || '').join('') + '0123456789오전후년월일요수정됨메모개내보냄';
    try { await Promise.all(['400','600'].map(w => document.fonts.load(`${w} 15px "IBM Plex Sans KR"`, allText.slice(0, 20000)))); } catch(_){}
    // preload pictures
    const pics = new Map();
    for (const m of msgs) for (const im of m.images || []){
      const src = imgSrc(im); if (!src || pics.has(src)) continue;
      try { pics.set(src, await loadImg(src)); } catch(_){ pics.set(src, null); }
    }
    const PW = 794, PH = 1123, M = 56, R = PW - M, BOTTOM = PH - 64;
    const C = {ink:'#1B1E24', sub:'#6B7380', faint:'#9AA1AD', rule:'#E3E6EB', bubble:'#FFF0A6', pill:'#EEF1F5', pillInk:'#5B6473'};
    const mctx = document.createElement('canvas').getContext('2d');
    const F = (w, px) => `${w} ${px}px ${FAM}`;
    const pages = [[]]; let y = M;
    const ops = () => pages[pages.length-1];
    const newPage = () => { pages.push([]); y = M; };
    // header
    mctx.font = F(600, 24);
    for (const ln of wrapText(mctx, room.name, PW - 2*M)){ ops().push({t:'text', s:ln, x:M, y, f:F(600, 24), c:C.ink}); y += 34; }
    ops().push({t:'text', s:`${fDay.format(new Date())} 내보냄 · 메모 ${msgs.length}개${roomTags(room).length ? ' · ' + tagStr(room) : ''}`, x:M, y:y+2, f:F(400, 13), c:C.sub});
    y += 30; ops().push({t:'line', x1:M, x2:R, y}); y += 14;
    const BW = Math.round((PW - 2*M) * 0.74), PADX = 14, PADY = 9, LH = 24;
    let prevDay = null;
    for (const m of msgs){
      const dk = dayKey(m.ts);
      if (dk !== prevDay){
        if (y + 52 > BOTTOM) newPage();
        y += 12;
        const label = fDay.format(new Date(m.ts)); mctx.font = F(400, 12);
        const w = mctx.measureText(label).width + 28;
        ops().push({t:'pill', x:(PW - w)/2, y, w, h:26, s:label});
        y += 38; prevDay = dk;
      }
      let last = null; // {page, x, bottom}
      for (const im of m.images || []){
        const pic = pics.get(imgSrc(im));
        let w = 280, h = 200;
        if (pic){ const s = Math.min(300 / pic.naturalWidth, 380 / pic.naturalHeight, 1.5); w = pic.naturalWidth * s; h = pic.naturalHeight * s; }
        const maxH = BOTTOM - M;
        if (h > maxH){ w *= maxH / h; h = maxH; }
        if (y + h > BOTTOM) newPage();
        ops().push({t:'img', pic, x:R - w, y, w, h});
        last = {page:pages.length-1, x:R - w, bottom:y + h};
        y += h + 6;
      }
      if (m.text){
        mctx.font = F(400, 15);
        const lines = wrapText(mctx, m.text, BW - 2*PADX);
        const w = Math.ceil(Math.max(...lines.map(l => mctx.measureText(l).width), 8)) + 2*PADX;
        const x = R - w;
        let i = 0;
        while (i < lines.length){
          if (y + 2*PADY + LH > BOTTOM) newPage();
          const piece = {t:'bubble', x, y, w, h:0}; ops().push(piece);
          let yy = y + PADY;
          while (i < lines.length && yy + LH <= BOTTOM - PADY){ ops().push({t:'text', s:lines[i], x:x + PADX, y:yy + 4, f:F(400, 15), c:C.ink}); yy += LH; i++; }
          piece.h = yy + PADY - y; y = piece.y + piece.h;
          last = {page:pages.length-1, x, bottom:y};
          if (i < lines.length) newPage();
        }
        y += 6;
      }
      if (last){
        const label = (m.edited ? '수정됨 · ' : '') + fTime.format(new Date(m.ts));
        pages[last.page].push({t:'text', s:label, x:last.x - 7, y:last.bottom - 15, f:F(400, 11), c:C.faint, a:'right'});
      }
      y += 6;
    }
    // draw pages
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({unit:'pt', format:'a4', compress:true});
    const SC = 2, N = pages.length;
    const cv = document.createElement('canvas'); cv.width = PW*SC; cv.height = PH*SC;
    const ctx = cv.getContext('2d');
    for (let p = 0; p < N; p++){
      toast(`PDF 만드는 중… ${p+1}/${N}쪽`, true);
      await sleep(0);
      ctx.setTransform(SC, 0, 0, SC, 0, 0);
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, PW, PH);
      ctx.textBaseline = 'top';
      for (const o of pages[p]){
        ctx.textAlign = 'left';
        if (o.t === 'text'){ ctx.font = o.f; ctx.fillStyle = o.c; ctx.textAlign = o.a || 'left'; ctx.fillText(o.s, o.x, o.y); }
        else if (o.t === 'line'){ ctx.strokeStyle = C.rule; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(o.x1, o.y + .5); ctx.lineTo(o.x2, o.y + .5); ctx.stroke(); }
        else if (o.t === 'pill'){ ctx.fillStyle = C.pill; rr(ctx, o.x, o.y, o.w, o.h, 13); ctx.fill(); ctx.font = F(400, 12); ctx.fillStyle = C.pillInk; ctx.textAlign = 'center'; ctx.fillText(o.s, o.x + o.w/2, o.y + 6); }
        else if (o.t === 'bubble'){ ctx.fillStyle = C.bubble; rr(ctx, o.x, o.y, o.w, o.h, 12); ctx.fill(); }
        else if (o.t === 'img'){
          ctx.save(); rr(ctx, o.x, o.y, o.w, o.h, 10); ctx.clip();
          if (o.pic) ctx.drawImage(o.pic, o.x, o.y, o.w, o.h);
          else { ctx.fillStyle = C.pill; ctx.fillRect(o.x, o.y, o.w, o.h); ctx.font = F(400, 12); ctx.fillStyle = C.pillInk; ctx.textAlign = 'center'; ctx.fillText('사진을 불러오지 못했어요', o.x + o.w/2, o.y + o.h/2 - 7); }
          ctx.restore();
        }
      }
      ctx.font = F(400, 11); ctx.fillStyle = C.faint;
      ctx.textAlign = 'left'; ctx.fillText(room.name.length > 40 ? room.name.slice(0, 40) + '…' : room.name, M, PH - 40);
      ctx.textAlign = 'right'; ctx.fillText(`${p+1} / ${N}`, R, PH - 40);
      if (p > 0) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg', .9), 'JPEG', 0, 0, 595.28, 841.89);
    }
    await saveFile(`${safeName(room.name)}-${stamp()}.pdf`, pdf.output('blob'));
  } catch(e){
    toast(e?.message === 'script' ? 'PDF 도구를 불러오지 못했어요. 연결을 확인해 주세요.' : 'PDF를 만들지 못했어요.');
  }
}

async function seedIfNew(){
  if (await backend.isSeeded()) return;
  await backend.markSeeded();
  if (S.rooms.length) return;
  const now = Date.now(), id = newId();
  const lines = [
    '모두톡에 오신 걸 환영해요. 여기는 나만 보는 채팅방이에요. 떠오르는 걸 바로 보내 두세요.',
    '메모방과 폴더를 마우스로 끌거나 터치로 길게 누른 채 끌어 이동해요. 선택 버튼으로 여러 항목을 체크할 수 있고, 이동 후 되돌리기도 가능해요.',
    '방 안의 메모를 길게 누르면 복사, 수정, 삭제, 댓글 달기를 할 수 있어요. 댓글은 펼치거나 접을 수 있고, 각 댓글의 ⋯ 메뉴로 개별 수정·삭제할 수 있어요.',
    '사진은 왼쪽 아래 + 버튼으로 첨부하거나, 캡처한 이미지를 입력창에 붙여넣으면 돼요.',
    '위쪽 돋보기로 이 방 안을, 목록 화면의 돋보기로 모든 방을 검색할 수 있어요.',
    '오른쪽 위 메뉴에서 이 방을 PDF로 내보낼 수 있고, 목록 화면 메뉴에서 전체 백업을 저장하거나 불러올 수 있어요.',
    '다 읽으셨으면 이 방은 지워도 괜찮아요.',
  ];
  await backend.setRoom({id, name:'모두톡 사용법', createdAt:now, updatedAt:now + lines.length, last:preview({text:lines[lines.length-1]}), pinned:false});
  for (let i = 0; i < lines.length; i++) await backend.setMsg(id, {id:newId() + i, ts:now + i, text:lines[i]});
}
async function boot(){
  renderList();
  if (window.claude && typeof window.claude.use === 'function'){
    try {
      const get = n => window.claude.use(n).catch(() => null);
      const [db, user, as, dl] = await Promise.all([get('db'), get('user'), get('assets'), get('downloads')]);
      assets = as; downloads = dl;
      const uid = user && typeof user.id === 'function' ? await user.id() : null;
      if (db && uid) backend = makeDb(db, uid);
    } catch(e) {}
  }
  if (!backend) backend = makeLocal();
  enableFileMirrorChangeTracking();
  await restoreFileMirrorHandle();
  await peerClient.restore(fileMirror.handle);
  let first = true;
  backend.watchRooms(list => {
    S.folders = list.filter(r=>r.kind==='folder'); S.archives = list.filter(r=>r.kind==='archive'); S.rooms = list.filter(r=>r.kind!=='folder' && r.kind!=='archive'); S.roomsLoaded = true;
    for(const id of chosenRooms)if(!list.some(item=>item.id===id))chosenRooms.delete(id);
    renderList();
    if (S.cur){
      if (!curRoom()){
        const replacement=S.rooms.find(room=>room.peerMergedRooms?.includes(S.cur));
        if(replacement){
          const drafts=[S.drafts[replacement.id]||'',input.value].filter(Boolean);
          S.drafts[replacement.id]=[...new Set(drafts)].join('\n');
          const pending=S.pending;S.pending=[];
          openRoom(replacement.id);S.pending=pending;renderPending();updateSend();
          if(drafts.length||pending.length)toast('같은 방을 합쳤어요. 작성 중인 내용은 입력창에 유지했어요.');
        }else closeRoom();
      }else renderRoomHeader();
    }
    if (pendingBootRoomId && S.roomsLoaded){
      const boot=S.rooms.find(item=>item.id===pendingBootRoomId)||S.rooms.find(item=>item.peerMergedRooms?.includes(pendingBootRoomId));
      pendingBootRoomId=null;
      if(boot)openRoom(boot.id);
      else{app.classList.remove('list-collapsed');syncListVisibility();}
    }
    if (first){ first = false; seedIfNew().finally(()=>scheduleVaultAutoBackup()).catch(() => {}); maintainVaultTrash().catch(()=>{}); if(fileMirror.pending) scheduleFileMirror(); }
  });
}
autosize(); updateSend();
setInterval(()=>{if(backend?.mode==='local')scheduleVaultAutoBackup();},30*60*1000);
boot();
setTimeout(()=>{void checkAppUpdates({manual:false});},2500);
})();
}
