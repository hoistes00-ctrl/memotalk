name: Publish MemoTalk Android v17.0.2 test APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memotalk-android-test-apk
  cancel-in-progress: false

jobs:
  build-and-publish-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MemoTalk source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare GitHub runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable Android test APK
        run: |
          cd android
          gradle --no-daemon --stacktrace assembleDebug
      - name: Verify independent package ID and APK signature
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/memotalk-badging.txt
          grep -F "name='kr.memotalk.app.test'" /tmp/memotalk-badging.txt
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Check output and copy to release folder
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/MemoTalk-Android-test.apk
          cd release-files
          sha256sum MemoTalk-Android-test.apk > SHA256SUMS-Android-test.txt
      - name: Retain APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoTalk-Android-test-apk
          path: |
            release-files/MemoTalk-Android-test.apk
            release-files/SHA256SUMS-Android-test.txt

      - name: Publish verified APK to public download branch
        shell: bash
        run: |
          set -euo pipefail
          cp release-files/MemoTalk-Android-test.apk "$RUNNER_TEMP/MemoTalk-Android-test.apk"
          cp release-files/SHA256SUMS-Android-test.txt "$RUNNER_TEMP/SHA256SUMS-Android-test.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan android-downloads
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/MemoTalk-Android-test.apk" ./MemoTalk-Android-test.apk
          cp "$RUNNER_TEMP/SHA256SUMS-Android-test.txt" ./SHA256SUMS-Android-test.txt
          printf '%s\n' \
            'MemoTalk Android v17.0.2: kr.memotalk.app.test (separate test app)' \
            'The APK is debug-signed using a temporary CI key.' \
            'Existing installs may fail to update if the signature differs. Save a JSON backup first; do not uninstall any app without verified backup.' \
            'This package does not replace kr.memotalk.app and does not automatically inherit its data.' > README.txt
          git add MemoTalk-Android-test.apk SHA256SUMS-Android-test.txt README.txt
          git commit -m "Publish MemoTalk v17.0.2 Android test APK"
          git push origin HEAD:refs/heads/android-downloads --force
