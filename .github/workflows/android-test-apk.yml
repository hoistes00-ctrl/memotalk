name: Validate Android debug build (no public release)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memotalk-android-test-apk
  cancel-in-progress: false

jobs:
  build-and-publish-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MemoTalk source
        uses: actions/checkout@v4
      - name: Check Android viewport/UI source assumptions
        run: node tests/check-ui.mjs
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare GitHub runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable Android test APK
        run: |
          cd android
          gradle --no-daemon --stacktrace assembleDebug
      - name: Verify independent package ID and APK signature
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/memotalk-badging.txt
          grep -F "name='kr.memotalk.app.test'" /tmp/memotalk-badging.txt
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Check output and copy to release folder
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/MemoTalk-Android-test.apk
          cd release-files
          sha256sum MemoTalk-Android-test.apk > SHA256SUMS-Android-test.txt
      - name: Retain APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoTalk-Android-test-apk
          path: |
            release-files/MemoTalk-Android-test.apk
            release-files/SHA256SUMS-Android-test.txt
