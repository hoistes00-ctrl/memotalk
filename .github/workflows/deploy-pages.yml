name: Deploy Modutalk download page

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: memotalk-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preserve the public root and docs URLs
        run: |
          mkdir -p site/docs
          cp index.html site/index.html
          cp -R docs/. site/docs/
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
