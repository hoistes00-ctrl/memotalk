name: Validate Windows-Android shared-folder sync

on:
  push:
    branches: ['feature/obsidian-bridge-prototype']
    paths:
      - 'shared/**'
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/peer-sync-check.yml'
  pull_request:
    paths:
      - 'shared/peer-sync*'
      - 'android/**'
      - 'tests/peer-*'
      - '.github/workflows/peer-sync-check.yml'

permissions:
  contents: read

jobs:
  protocol:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check-ui.mjs
      - run: node --test tests/mirror.test.cjs tests/native-bridge.test.cjs tests/peer-sync.test.cjs

  android:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify SAF writer and build isolated sharing-preview APK
        working-directory: android
        run: gradle --no-daemon testSharingPreviewUnitTest assembleSharingPreview
      - uses: actions/upload-artifact@v4
        with:
          name: MemoTalk-sharing-preview-Android
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/sharingPreview/*.apk
            android/app/build/reports/tests/testSharingPreviewUnitTest/**

  android-runtime:
    needs: android
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate synthetic Windows revision fixtures
        run: node tests/make-peer-device-fixture.cjs
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual SAF and Android WebView sharing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle -p android --no-daemon connectedSharingPreviewAndroidTest
            adb exec-out run-as kr.memotalk.app.sharingpreview tar -C files -cf - peer-return > peer-return.tar
            mkdir -p peer-returned
            tar -xf peer-return.tar -C peer-returned
            node tests/verify-peer-android-return.cjs peer-returned/peer-return
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MemoTalk-sharing-Android-runtime-reports
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
      - uses: actions/upload-artifact@v4
        with:
          name: MemoTalk-sharing-Android-return-revisions
          if-no-files-found: error
          path: peer-returned/peer-return/*.json

  roundtrip-windows:
    needs: android-runtime
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: MemoTalk-sharing-Android-return-revisions
          path: android-return
      - run: node tests/verify-peer-android-return.cjs android-return
